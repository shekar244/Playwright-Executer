# TEMPLATE ONLY. Create this Secret from the CLI or a secret manager before applying grid-* manifests.
# All values must be replaced. api-token is the full coordinator token used by Amplify; pod-api-token
# is a separate limited token used only by runner pods.
apiVersion: v1
kind: Secret
metadata:
  name: playwright-db-credentials
type: Opaque
stringData:
  postgres-user: testuser
  postgres-password: CHANGE_ME
  postgres-db: testdb
  api-token: CHANGE_ME
  pod-api-token: CHANGE_ME
  database-url: postgresql://testuser:CHANGE_ME@postgres-service:5432/testdb
  keda-connection: postgresql://testuser:CHANGE_ME@postgres-service.NAMESPACE.svc.cluster.local:5432/testdb?sslmode=disable
