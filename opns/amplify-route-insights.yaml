# Jira Insights at /jira-insights on the SAME host as Amplify QEA (amplify-route.yaml): OpenShift sends requests whose
# path starts with /jira-insights to the amplify-insights service, everything else to amplify-qea. The path is not
# rewritten: Insights serves under it (STREAMLIT_SERVER_BASE_URL_PATH=jira-insights in amplify-deployment-insights.yaml).
#
# `host` must be the amplify-qea route's host. amplify-jfrog-deploy.sh fills it in; by hand:
#   HOST=$(oc get route amplify-qea -o jsonpath='{.spec.host}')
#   sed "s|AMPLIFY_HOST|$HOST|" opns/amplify-route-insights.yaml | oc apply -f -
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: amplify-insights
  labels:
    app: amplify-insights
  annotations:
    # Streamlit keeps a WebSocket open; the router's default 30s idle timeout would drop a quiet session.
    haproxy.router.openshift.io/timeout: 3600s
spec:
  host: AMPLIFY_HOST
  path: /jira-insights
  to:
    kind: Service
    name: amplify-insights
  port:
    targetPort: streamlit
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
