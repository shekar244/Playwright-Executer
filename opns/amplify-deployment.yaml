apiVersion: apps/v1
kind: Deployment
metadata:
  name: amplify-qea
  labels:
    app: amplify-qea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amplify-qea
  template:
    metadata:
      labels:
        app: amplify-qea
    spec:
      containers:
        - name: amplify-qea
          image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/amplify-qea:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CONTAINER
              value: "1"
            - name: PORT
              value: "8080"
            # Jira Insights runs in its own pod (amplify-deployment-insights.yaml). Browsers reach it at /jira-insights on
            # this app's own host (amplify-route-insights.yaml); QEA checks its health on the service and never starts
            # a Streamlit process of its own. Users enter through /api/insights/open, signed in as their QEA user.
            - name: INSIGHTS_PUBLIC_URL
              value: "/jira-insights"
            - name: INSIGHTS_INTERNAL_URL
              value: "http://amplify-insights:8501/jira-insights"
            - name: GRID_COORDINATOR_URL
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: grid-coordinator-url
                  optional: true
            - name: GRID_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: grid-api-token
                  optional: true
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: jwt-secret-key
            - name: JIRA_URL
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: jira-url
                  optional: true
            - name: JIRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: jira-username
                  optional: true
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: jira-api-token
                  optional: true
            - name: ZEPHYR_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: zephyr-access-key
                  optional: true
            - name: ZEPHYR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: zephyr-secret-key
                  optional: true
            - name: ZEPHYR_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: zephyr-account-id
                  optional: true
          volumeMounts:
            - name: amplify-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: amplify-data
          persistentVolumeClaim:
            claimName: amplify-data-pvc
