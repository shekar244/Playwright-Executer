# TEMPLATE ONLY — replace placeholder values before applying.
# Generate a strong JWT secret: openssl rand -base64 32
#
# Apply with:
#   oc create -f amplify-secrets.yaml
# Or create from CLI:
#   oc create secret generic amplify-secrets \
#     --from-literal=jwt-secret-key="$(openssl rand -base64 32)" \
#     --from-literal=jira-url="https://yourcompany.atlassian.net" \
#     --from-literal=jira-username="qa@yourcompany.com" \
#     --from-literal=jira-api-token="YOUR_JIRA_API_TOKEN" \
#     --from-literal=zephyr-access-key="YOUR_ZEPHYR_ACCESS_KEY" \
#     --from-literal=zephyr-secret-key="YOUR_ZEPHYR_SECRET_KEY" \
#     --from-literal=zephyr-account-id="YOUR_ATLASSIAN_ACCOUNT_ID"

apiVersion: v1
kind: Secret
metadata:
  name: amplify-secrets
  labels:
    app: amplify-qea
type: Opaque
stringData:
  jwt-secret-key: "openssl_rand -base64 32"
  jira-url: "https://yourcompany.atlassian.net"
  jira-username: "qa@yourcompany.com"
  jira-api-token: "REPLACE_WITH_JIRA_API_TOKEN"
  zephyr-access-key: "REPLACE_WITH_ZEPHYR_ACCESS_KEY"
  zephyr-secret-key: "REPLACE_WITH_ZEPHYR_SECRET_KEY"
  zephyr-account-id: "REPLACE_WITH_ATLASSIAN_ACCOUNT_ID"
