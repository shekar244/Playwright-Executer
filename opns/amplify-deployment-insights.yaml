apiVersion: apps/v1
kind: Deployment
metadata:
  name: amplify-insights
  labels:
    app: amplify-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amplify-insights
  template:
    metadata:
      labels:
        app: amplify-insights
    spec:
      # Same users and workspaces as QEA: both pods mount amplify-data-pvc at /app/data (users, per-user
      # workspaces/<id>/jira_insights). The PVC is ReadWriteOnce, so this pod must run on the node where amplify-qea
      # runs. With a ReadWriteMany storage class, set the PVC to RWX and drop this block.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: amplify-qea
      containers:
        - name: amplify-insights
          image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/amplify-insights:latest
          ports:
            - containerPort: 8501
              name: streamlit
          env:
            - name: CONTAINER
              value: "1"
            - name: HOME
              value: "/tmp"
            # Served under /jira-insights (amplify-route-insights.yaml sends that path of QEA's host here): every page,
            # asset and WebSocket of Streamlit lives under it, and so does the health check below.
            - name: STREAMLIT_SERVER_BASE_URL_PATH
              value: "jira-insights"
            # Insights' own sign-in form and the option flags go through QEA: the same user accounts.
            - name: QEA_API_URL
              value: "http://amplify-qea:8080"
            # Same secret as amplify-qea: Insights verifies the sign-in token QEA issues with this key.
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: jwt-secret-key
            - name: JIRA_URL
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: jira-url, optional: true }
            - name: JIRA_USERNAME
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: jira-username, optional: true }
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: jira-api-token, optional: true }
            - name: ZEPHYR_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: zephyr-access-key, optional: true }
            - name: ZEPHYR_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: zephyr-secret-key, optional: true }
            - name: ZEPHYR_ACCOUNT_ID
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: zephyr-account-id, optional: true }
          volumeMounts:
            - name: amplify-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /jira-insights/_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /jira-insights/_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: amplify-data
          persistentVolumeClaim:
            claimName: amplify-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: amplify-insights
  labels:
    app: amplify-insights
spec:
  selector:
    app: amplify-insights
  ports:
    - name: streamlit
      port: 8501
      targetPort: 8501
