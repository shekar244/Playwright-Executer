apiVersion: apps/v1
kind: Deployment
metadata:
  name: amplify-insights
  labels:
    app: amplify-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amplify-insights
  template:
    metadata:
      labels:
        app: amplify-insights
    spec:
      containers:
        - name: amplify-insights
          image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/amplify-insights:latest
          ports:
            - containerPort: 8501
              name: streamlit
          env:
            - name: CONTAINER
              value: "1"
            - name: HOME
              value: "/tmp"
            # Same secret as amplify-qea: Insights verifies the sign-in token QEA issues with this key.
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: amplify-secrets
                  key: jwt-secret-key
            - name: JIRA_URL
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: jira-url, optional: true }
            - name: JIRA_USERNAME
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: jira-username, optional: true }
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: jira-api-token, optional: true }
            - name: ZEPHYR_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: zephyr-access-key, optional: true }
            - name: ZEPHYR_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: zephyr-secret-key, optional: true }
            - name: ZEPHYR_ACCOUNT_ID
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: zephyr-account-id, optional: true }
          volumeMounts:
            - name: amplify-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: amplify-data
          persistentVolumeClaim:
            claimName: amplify-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: amplify-insights
  labels:
    app: amplify-insights
spec:
  selector:
    app: amplify-insights
  ports:
    - name: streamlit
      port: 8501
      targetPort: 8501
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: amplify-insights
  labels:
    app: amplify-insights
spec:
  to:
    kind: Service
    name: amplify-insights
  port:
    targetPort: streamlit
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
