# If connecting to an existing external enterprise database, skip the Deployment and
# Service in this file. Keep (or recreate) the Secret so that BOTH "database-url" (coordinator)
# and "keda-connection" (autoscaler) point at your external database, with an appropriate
# sslmode (e.g. ?sslmode=require for a managed database).
#
# "keda-connection" is used by the KEDA operator, which runs in its own namespace (e.g.
# openshift-keda): for the in-cluster database use the fully qualified host
# postgres-service.<namespace>.svc.cluster.local, not the short service name.
#
# IMPORTANT: replace every CHANGE_ME below before applying, or better, create the
# Secret out-of-band and delete the Secret document from this file:
#   oc create secret generic playwright-db-credentials \
#     --from-literal=postgres-user=testuser \
#     --from-literal=postgres-password='<strong-password>' \
#     --from-literal=postgres-db=testdb \
#     --from-literal=api-token='<long-random-token>' \
#     --from-literal=pod-api-token='<a-different-long-random-token>' \
#     --from-literal=database-url='postgresql://testuser:<strong-password>@postgres-service:5432/testdb' \
#     --from-literal=keda-connection='postgresql://testuser:<strong-password>@postgres-service.<namespace>.svc.cluster.local:5432/testdb?sslmode=disable'
apiVersion: v1
kind: Secret
metadata:
  name: playwright-db-credentials
type: Opaque
stringData:
  postgres-user: testuser
  postgres-password: CHANGE_ME
  postgres-db: testdb
  # The FULL token for the coordinator API (X-API-Token): Amplify and the seeder send it and it
  # may call every endpoint. Generate one with: openssl rand -hex 32
  api-token: CHANGE_ME
  # OPTIONAL token for the RUNNER PODS. Test code runs inside the pods and can read the token
  # they hold, so this one only opens the endpoints a pod needs (lease, submit, Allure upload,
  # release, heartbeat, exit, GET code); everything else answers 403. The runners' GRID_API_TOKEN
  # should be THIS token, Amplify keeps api-token. Use a different value (openssl rand -hex 32).
  # Remove the key and the coordinator accepts only api-token, which pods must then use.
  pod-api-token: CHANGE_ME
  database-url: postgresql://testuser:CHANGE_ME@postgres-service:5432/testdb
  keda-connection: postgresql://testuser:CHANGE_ME@postgres-service.NAMESPACE.svc.cluster.local:5432/testdb?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: playwright-db-credentials
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: playwright-db-credentials
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: playwright-db-credentials
              key: postgres-db
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: pg-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      # emptyDir: queue/results are lost if the pod restarts. Swap for a
      # PersistentVolumeClaim if results must outlive the database pod.
      - name: pg-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres-db
