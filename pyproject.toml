[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amplify-server"
version = "1.0.0"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]
include = ["amplify_server*", "jira_insights*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
