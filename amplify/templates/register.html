<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amplify QEA — Create Account</title>
  <link rel="stylesheet" href="/static/css/amplify.css">
  <style>
    body { justify-content: center; align-items: center; overflow: auto; }
    .auth-card {
      width: 100%; max-width: 380px; background: var(--surface);
      border: 0.5px solid var(--border); border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg); padding: 36px 32px 32px;
    }
    .auth-header { text-align: center; margin-bottom: 28px; }
    .auth-logo {
      width: 48px; height: 48px; border-radius: 13px; margin: 0 auto 14px;
      background: linear-gradient(180deg, #4da3ff 0%, #0071e3 100%);
      color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px;
      box-shadow: 0 2px 8px rgba(0,113,227,0.30), inset 0 0.5px 0 rgba(255,255,255,0.4);
    }
    .auth-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .auth-header h1 span { color: var(--text-dim); font-weight: 500; }
    .auth-header .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
    .auth-form { display: flex; flex-direction: column; gap: 16px; }
    .auth-form .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .auth-form .hint { margin-top: -4px; }
    .auth-error {
      font-size: 12px; color: var(--red); background: var(--red-glow);
      padding: 8px 12px; border-radius: var(--radius); display: none; text-align: center;
    }
    .auth-error.visible { display: block; }
    .auth-submit {
      width: 100%; padding: 11px; background: var(--accent); color: var(--on-accent);
      border: none; border-radius: 980px; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: filter var(--tr), transform var(--tr); margin-top: 4px;
    }
    .auth-submit:hover { filter: brightness(1.08); }
    .auth-submit:active { transform: scale(0.98); }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-dim); }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-loading { display: none; text-align: center; color: var(--accent); font-size: 12px; padding: 4px; }
    .theme-switch {
      position: fixed; top: 16px; right: 16px; background: var(--surface);
      border: 0.5px solid var(--border); border-radius: 980px; padding: 6px 12px;
      cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px;
      box-shadow: var(--shadow-sm); transition: background var(--tr);
    }
    .theme-switch:hover { background: var(--surface2); }
    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px 24px; margin: 12px; border-radius: var(--radius-lg); }
      .auth-header h1 { font-size: 20px; }
      .auth-logo { width: 42px; height: 42px; font-size: 20px; }
    }
  </style>
</head>
<body>
<script>
  (function(){try{var t=localStorage.getItem('amplify-theme');if(t?t==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches)document.body.classList.add('dark-theme');}catch(e){}})();
</script>

<button class="theme-switch" onclick="toggleTheme()" title="Toggle theme">
  <span id="themeIcon">☀️</span>
</button>

<div class="auth-card">
  <div class="auth-header">
    <div class="auth-logo" aria-hidden="true">⚡</div>
    <h1>Amplify <span>QEA</span></h1>
    <div class="subtitle">Create your account</div>
  </div>

  <form class="auth-form" id="registerForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username">
      <div class="hint">At least 3 characters</div>
    </div>
    <div class="field">
      <label for="email">Email <span style="font-weight:400;color:var(--text-dim)">(optional)</span></label>
      <input type="email" id="email" name="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password">
      <div class="hint">At least 6 characters</div>
    </div>
    <div class="auth-error" id="errorMsg"></div>
    <button type="submit" class="auth-submit" id="submitBtn">Create Account</button>
    <div class="auth-loading" id="loading">Creating account...</div>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="/login">Sign in</a>
  </div>
</div>

<script>
function toggleTheme() {
  const dark = !document.body.classList.contains('dark-theme');
  document.body.classList.toggle('dark-theme', dark);
  document.getElementById('themeIcon').textContent = dark ? '🌙' : '☀️';
  try { localStorage.setItem('amplify-theme', dark ? 'dark' : 'light'); } catch(e) {}
}
(function() {
  const dark = document.body.classList.contains('dark-theme');
  document.getElementById('themeIcon').textContent = dark ? '🌙' : '☀️';
})();

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('errorMsg');
  const btn = document.getElementById('submitBtn');
  const loading = document.getElementById('loading');
  err.classList.remove('visible');
  btn.disabled = true;
  loading.style.display = 'block';
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        email: document.getElementById('email').value || undefined,
        password: document.getElementById('password').value
      })
    });
    if (r.ok) { window.location.href = '/'; return; }
    const d = await r.json();
    err.textContent = d.error || 'Registration failed';
    err.classList.add('visible');
  } catch (ex) {
    err.textContent = 'Network error';
    err.classList.add('visible');
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
});
</script>
</body>
</html>
