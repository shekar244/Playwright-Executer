<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amplify QEA — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#f5f5f7;--surface:#fff;--surface2:#f0f0f2;--border:rgba(0,0,0,.1);--text:#1d1d1f;--text-muted:#6e6e73;--accent:#0071e3;--green:#248a3d;--red:#d70015;--yellow:#b25000;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,.06)}
    body{font-family:Inter,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
    .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
    .topbar h1{font-size:18px;font-weight:700;color:var(--accent)}
    .topbar .back{color:var(--accent);text-decoration:none;font-weight:500;font-size:13px}
    .topbar .spacer{flex:1}
    .topbar .user-info{font-size:12px;color:var(--text-muted)}
    .container{max-width:1200px;margin:0 auto;padding:20px 24px}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
    .metric-card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
    .metric-card .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px}
    .metric-card .value{font-size:28px;font-weight:700}
    .metric-card .sub{font-size:11px;color:var(--text-muted);margin-top:4px}
    .section{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
    .section-header{padding:14px 18px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .section-header .badge{background:var(--accent);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);background:var(--surface2);border-bottom:1px solid var(--border)}
    td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    .badge-admin{background:var(--accent);color:#fff;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
    .badge-active{background:rgba(36,138,61,.15);color:var(--green);padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
    .badge-disabled{background:rgba(215,0,21,.12);color:var(--red);padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
    .btn{padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:11px;font-weight:500;transition:all .15s}
    .btn:hover{background:var(--surface2)}
    .btn-danger{color:var(--red);border-color:rgba(215,0,21,.3)}
    .btn-danger:hover{background:rgba(215,0,21,.08)}
    .btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn-accent:hover{opacity:.9}
    .actions{display:flex;gap:4px;flex-wrap:wrap}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
    .modal-overlay.active{display:flex}
    .modal{background:var(--surface);border-radius:14px;padding:24px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .modal h3{margin-bottom:14px;font-size:16px}
    .modal input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:12px}
    .modal .modal-actions{display:flex;gap:8px;justify-content:flex-end}
    .activity-row{display:flex;gap:12px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;align-items:baseline}
    .activity-row:last-child{border-bottom:none}
    .activity-row .time{color:var(--text-muted);min-width:140px;font-size:11px}
    .activity-row .user{font-weight:600;min-width:80px}
    .activity-row .action{color:var(--accent);font-weight:500;min-width:120px}
    .empty{padding:40px;text-align:center;color:var(--text-muted)}
    .disk{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)}
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="back">← Back to App</a>
    <h1>Admin Panel</h1>
    <div class="spacer"></div>
    <div class="user-info">Logged in as <strong>{{ user.username }}</strong></div>
  </div>

  <div class="container">
    <div class="metrics" id="metricsGrid"></div>

    <div class="section">
      <div class="section-header">Users <span class="badge" id="userCount">0</span></div>
      <table>
        <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Created</th><th>Disk</th><th>Actions</th></tr></thead>
        <tbody id="usersBody"><tr><td colspan="9" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>

    <div class="section">
      <div class="section-header">Recent Activity <span class="badge" id="activityCount">0</span></div>
      <div id="activityList" style="max-height:400px;overflow-y:auto"><div class="empty">Loading...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="resetModal">
    <div class="modal">
      <h3>Reset Password</h3>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">User: <strong id="resetUser"></strong></p>
      <input type="password" id="resetPw" placeholder="New password (min 6 chars)">
      <div class="modal-actions">
        <button class="btn" onclick="closeReset()">Cancel</button>
        <button class="btn btn-accent" onclick="doReset()">Reset Password</button>
      </div>
    </div>
  </div>

<script>
let _resetId = null;

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'Z').toLocaleString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function api(url, opts) {
  const r = await fetch(url, opts);
  return r.json();
}

async function loadMetrics() {
  const m = await api('/api/admin/metrics');
  document.getElementById('metricsGrid').innerHTML = `
    <div class="metric-card"><div class="label">Total Users</div><div class="value">${m.total_users}</div><div class="sub">${m.active_accounts} active · ${m.admin_count} admin</div></div>
    <div class="metric-card"><div class="label">Active Today</div><div class="value">${m.active_users_today}</div><div class="sub">${m.active_users_week} this week</div></div>
    <div class="metric-card"><div class="label">Events Today</div><div class="value">${m.events_today}</div><div class="sub">${m.total_events} total</div></div>
    <div class="metric-card"><div class="label">Total Disk</div><div class="value">${fmtBytes(m.total_workspace_bytes)}</div><div class="sub">all workspaces</div></div>
  `;
}

async function loadUsers() {
  const users = await api('/api/admin/users');
  document.getElementById('userCount').textContent = users.length;
  if (!users.length) { document.getElementById('usersBody').innerHTML = '<tr><td colspan="9" class="empty">No users</td></tr>'; return; }
  document.getElementById('usersBody').innerHTML = users.map(u => `
    <tr>
      <td>${u.id}</td>
      <td><strong>${u.username}</strong></td>
      <td>${u.email || '—'}</td>
      <td>${u.is_admin ? '<span class="badge-admin">admin</span>' : 'user'}</td>
      <td>${u.is_active ? '<span class="badge-active">active</span>' : '<span class="badge-disabled">disabled</span>'}</td>
      <td>${fmtDate(u.last_login_at)}</td>
      <td>${fmtDate(u.created_at)}</td>
      <td class="disk">${fmtBytes(u.workspace_bytes)}</td>
      <td class="actions">
        <button class="btn" onclick="openReset(${u.id},'${u.username}')">Reset PW</button>
        <button class="btn" onclick="toggleUser(${u.id})">${u.is_active ? 'Disable' : 'Enable'}</button>
        <button class="btn" onclick="promoteUser(${u.id})">${u.is_admin ? 'Demote' : 'Promote'}</button>
        <button class="btn btn-danger" onclick="deleteUser(${u.id},'${u.username}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

async function loadActivity() {
  const items = await api('/api/admin/activity?limit=100');
  document.getElementById('activityCount').textContent = items.length;
  if (!items.length) { document.getElementById('activityList').innerHTML = '<div class="empty">No activity yet</div>'; return; }
  document.getElementById('activityList').innerHTML = items.map(a => `
    <div class="activity-row">
      <span class="time">${fmtDate(a.created_at)}</span>
      <span class="user">${a.username}</span>
      <span class="action">${a.action}</span>
      <span>${a.detail || ''}</span>
    </div>
  `).join('');
}

function openReset(id, name) {
  _resetId = id;
  document.getElementById('resetUser').textContent = name;
  document.getElementById('resetPw').value = '';
  document.getElementById('resetModal').classList.add('active');
}

function closeReset() {
  document.getElementById('resetModal').classList.remove('active');
  _resetId = null;
}

async function doReset() {
  const pw = document.getElementById('resetPw').value;
  if (pw.length < 6) return alert('Password must be at least 6 characters');
  await api(`/api/admin/users/${_resetId}/reset`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw})});
  closeReset();
  loadActivity();
}

async function toggleUser(id) {
  await api(`/api/admin/users/${id}/toggle`, {method:'POST'});
  loadUsers(); loadActivity();
}

async function promoteUser(id) {
  await api(`/api/admin/users/${id}/promote`, {method:'POST'});
  loadUsers(); loadActivity();
}

async function deleteUser(id, name) {
  if (!confirm(`Delete user "${name}" and their entire workspace? This cannot be undone.`)) return;
  await api(`/api/admin/users/${id}`, {method:'DELETE'});
  loadUsers(); loadMetrics(); loadActivity();
}

loadMetrics(); loadUsers(); loadActivity();
</script>
</body>
</html>
