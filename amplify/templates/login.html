<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amplify QEA — Sign In</title>
  <link rel="stylesheet" href="/static/css/amplify.css">
  <style>
    body { justify-content: center; align-items: center; overflow: auto; }
    .auth-card {
      width: 100%; max-width: 400px; background: var(--surface);
      border: 1px solid var(--border); border-top: 4px solid var(--accent);
      border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 40px 36px 36px;
    }
    .auth-header { text-align: center; margin-bottom: 28px; }
    .auth-logo {
      width: 48px; height: 48px; border-radius: 13px; margin: 0 auto 14px;
      background: linear-gradient(180deg, #4da3ff 0%, #0071e3 100%);
      color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px;
      box-shadow: 0 2px 8px rgba(0,113,227,0.30), inset 0 0.5px 0 rgba(255,255,255,0.4);
    }
    .auth-header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
    .auth-header h1 span { color: var(--text-dim); font-weight: 500; }
    .auth-header .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
    .auth-form { display: flex; flex-direction: column; gap: 16px; }
    .auth-form .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .auth-error {
      font-size: 12px; color: var(--red); background: var(--red-glow);
      padding: 8px 12px; border-radius: var(--radius); display: none; text-align: center;
    }
    .auth-error.visible { display: block; }
    .auth-submit {
      width: 100%; padding: 12px; background: var(--accent); color: var(--on-accent);
      border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: filter var(--tr), transform var(--tr); margin-top: 4px; letter-spacing: 0.02em;
    }
    .auth-submit:hover { filter: brightness(1.08); }
    .auth-submit:active { transform: scale(0.98); }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-dim); }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-loading { display: none; text-align: center; color: var(--accent); font-size: 12px; padding: 4px; }
    .theme-switch {
      position: fixed; top: 16px; right: 16px; background: var(--surface);
      border: 0.5px solid var(--border); border-radius: 980px; padding: 6px 12px;
      cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px;
      box-shadow: var(--shadow-sm); transition: background var(--tr);
    }
    .theme-switch:hover { background: var(--surface2); }
    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px 24px; margin: 12px; border-radius: var(--radius-lg); }
      .auth-header h1 { font-size: 20px; }
      .auth-logo { width: 42px; height: 42px; font-size: 20px; }
    }
  </style>
</head>
<body>
<script>
  (function(){try{var t=localStorage.getItem('amplify-theme')||'light';var m={dark:'dark-theme',midnight:'theme-midnight',nord:'theme-nord',solarized:'theme-solarized',rose:'theme-rose',forest:'theme-forest',ocean:'theme-ocean'};if(m[t])document.body.classList.add(m[t]);}catch(e){}})();
</script>

<div class="auth-card">
  <div class="auth-header">
    <div class="auth-logo" aria-hidden="true">⚡</div>
    <h1>Amplify <span>QEA</span></h1>
    <div class="subtitle">Sign in to your workspace</div>
  </div>

  <form class="auth-form" id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <div class="auth-error" id="errorMsg"></div>
    <button type="submit" class="auth-submit" id="submitBtn">Sign In</button>
    <div class="auth-loading" id="loading">Signing in...</div>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="/register">Create one</a>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('errorMsg');
  const btn = document.getElementById('submitBtn');
  const loading = document.getElementById('loading');
  err.classList.remove('visible');
  btn.disabled = true;
  loading.style.display = 'block';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if (r.ok) { window.location.href = '/'; return; }
    const d = await r.json();
    err.textContent = d.error || 'Login failed';
    err.classList.add('visible');
  } catch (ex) {
    err.textContent = 'Network error';
    err.classList.add('visible');
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
});
</script>
</body>
</html>
