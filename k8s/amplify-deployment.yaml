# Amplify QEA — the Flask app (login, Executor, Dashboard, Admin Panel, ...) on port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amplify-qea-grid
  labels:
    app: amplify-qea-grid
spec:
  replicas: 1                 # SQLite + in-process run state: keep at 1
  strategy:
    type: Recreate            # never two pods writing the same SQLite file during a rollout
  selector:
    matchLabels:
      app: amplify-qea-grid
  template:
    metadata:
      labels:
        app: amplify-qea-grid
    spec:
      # Private registry (e.g. JFrog)? Create the pull secret (see README) and uncomment:
      # imagePullSecrets:
      #   - name: registry-pull-secret
      containers:
        - name: amplify-qea-grid
          image: amplify-qea-grid:latest           # real registry path comes from kustomization.yaml
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CONTAINER
              value: "1"
            - name: PORT
              value: "8080"
            # Jira Hub runs in its own pod (amplify-deployment-insights.yaml). Browsers reach it at /jira-hub on
            # this app's own host (amplify-ingress.yaml); QEA checks its health on the service and never starts a
            # Streamlit process of its own. Users enter through /api/insights/open, signed in as their QEA user.
            - name: INSIGHTS_PUBLIC_URL
              value: "/jira-hub"
            - name: INSIGHTS_INTERNAL_URL
              value: "http://jira-hub:8501/jira-hub"
            - name: GRID_COORDINATOR_URL
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: grid-coordinator-url, optional: true }
            - name: GRID_API_TOKEN
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: grid-api-token, optional: true }
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: jwt-secret-key }
            - name: JIRA_URL
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: jira-url, optional: true }
            - name: JIRA_USERNAME
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: jira-username, optional: true }
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: jira-api-token, optional: true }
            - name: ZEPHYR_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: zephyr-access-key, optional: true }
            - name: ZEPHYR_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: zephyr-secret-key, optional: true }
            - name: ZEPHYR_ACCOUNT_ID
              valueFrom:
                secretKeyRef: { name: amplify-secrets, key: zephyr-account-id, optional: true }
          volumeMounts:
            - name: amplify-data
              mountPath: /app/data
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 2Gi }
          readinessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: amplify-data
          persistentVolumeClaim:
            claimName: amplify-data-pvc
