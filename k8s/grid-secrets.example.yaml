# Example only. NOT referenced by any kustomization: do not apply it with real values committed.
#
# Every workload reads its credentials from one Secret named "playwright-db-credentials".
# Create it however your platform manages secrets, for example:
#   - sync it from Azure Key Vault (Secrets Store CSI Driver with secretObjects, or External Secrets), or
#   - kubectl create secret generic playwright-db-credentials --from-literal=... (see keys below)
#
# Keys:
#   database-url     coordinator -> PostgreSQL (SQLAlchemy URL: postgresql://user:pass@host:5432/db)
#   keda-connection  KEDA -> PostgreSQL (libpq URL; add ?sslmode=require for a managed database).
#                    The KEDA operator connects from ITS OWN namespace, so the host must be fully
#                    qualified (postgres-service.<namespace>.svc.cluster.local), unlike database-url.
#   api-token        the FULL X-API-Token for the coordinator API (coordinator, Amplify, seeder): it
#                    may call every endpoint. Required by these manifests: a missing key fails pod
#                    start instead of silently running the API unauthenticated.
#   pod-api-token    OPTIONAL second token for the RUNNER PODS. Test code runs inside the pods and can
#                    read the token they hold, so this one only opens the endpoints a pod needs (lease,
#                    submit, Allure upload, release, heartbeat, exit, GET code); everything else
#                    answers 403. The runners' GRID_API_TOKEN should be the POD token; Amplify keeps
#                    the full api-token. Use a DIFFERENT value (openssl rand -hex 32). Without this key
#                    the coordinator accepts only api-token and pods must use it, as before.
#   postgres-user / postgres-password / postgres-db   only for the optional in-cluster k8s/grid-postgres
apiVersion: v1
kind: Secret
metadata:
  name: playwright-db-credentials
type: Opaque
stringData:
  postgres-user: testuser
  postgres-password: CHANGE_ME
  postgres-db: testdb
  api-token: CHANGE_ME            # openssl rand -hex 32
  pod-api-token: CHANGE_ME        # optional; a different openssl rand -hex 32 (runners' GRID_API_TOKEN)
  database-url: postgresql://testuser:CHANGE_ME@postgres-service:5432/testdb
  keda-connection: postgresql://testuser:CHANGE_ME@postgres-service.NAMESPACE.svc.cluster.local:5432/testdb?sslmode=disable
