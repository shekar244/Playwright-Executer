apiVersion: v1
kind: Service
metadata:
  name: amplify-qea
  labels:
    app: amplify-qea
spec:
  selector:
    app: amplify-qea
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: amplify-insights
  labels:
    app: amplify-insights
spec:
  selector:
    app: amplify-insights
  ports:
    - name: streamlit
      port: 8501
      targetPort: streamlit
