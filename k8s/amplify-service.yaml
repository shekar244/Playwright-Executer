apiVersion: v1
kind: Service
metadata:
  name: amplify-qea-grid
  labels:
    app: amplify-qea-grid
spec:
  selector:
    app: amplify-qea-grid
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: jira-hub
  labels:
    app: jira-hub
spec:
  selector:
    app: jira-hub
  ports:
    - name: streamlit
      port: 8501
      targetPort: streamlit
