# TEMPLATE ONLY — not part of kustomization.yaml, so it is never applied by accident.
# Do not commit real values. Create the real secret from the CLI instead:
#
#   kubectl -n amplify create secret generic amplify-secrets \
#     --from-literal=jwt-secret-key="$(openssl rand -base64 32)"
#
# jwt-secret-key is REQUIRED and is used by BOTH apps: QEA signs sessions with it and
# Insights verifies the sign-in token QEA hands it, so they must share one value.
# The jira-* / zephyr-* keys are optional; an admin can also set them later in
# Admin Panel -> Server Secrets (the value saved there wins).
apiVersion: v1
kind: Secret
metadata:
  name: amplify-secrets
  namespace: amplify
type: Opaque
stringData:
  jwt-secret-key: "CHANGE_ME_openssl_rand_base64_32"
  jira-url: "https://yourcompany.atlassian.net"
  jira-username: "qa@yourcompany.com"
  jira-api-token: "REPLACE_ME"
  zephyr-access-key: "REPLACE_ME"
  zephyr-secret-key: "REPLACE_ME"
  zephyr-account-id: "REPLACE_ME"
  grid-coordinator-url: "http://central-coordinator-svc.amplify.svc.cluster.local:8000"
  grid-api-token: "REPLACE_ME"
