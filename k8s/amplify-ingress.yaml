# Assumes the ingress-nginx controller. Replace amplify.example.com with your host in both Ingresses: QEA at /,
# Jira Hub at /jira-hub (INSIGHTS_PUBLIC_URL in amplify-deployment.yaml).
#
# TLS: either create the secret yourself
#   kubectl -n amplify create secret tls amplify-tls --cert=tls.crt --key=tls.key
# or let cert-manager issue it by uncommenting the cluster-issuer annotation (one certificate for the host).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amplify-qea-grid
  labels:
    app: amplify-qea-grid
  annotations:
    # Live test logs stream over Server-Sent Events — nginx must not buffer them.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"      # file uploads (CSV / Excel / results)
    # cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [amplify.example.com]
      secretName: amplify-tls
  rules:
    - host: amplify.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: amplify-qea-grid
                port:
                  name: http
---
# Jira Hub at /jira-hub on the same host as QEA (ingress-nginx merges Ingresses for one host; the longer
# path wins). Not rewritten: Insights serves under /jira-hub (STREAMLIT_SERVER_BASE_URL_PATH).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jira-hub
  labels:
    app: jira-hub
  annotations:
    # Streamlit runs on WebSockets; ingress-nginx upgrades them automatically, but the
    # default 60s idle timeout would drop a quiet session.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"      # Jira export uploads
spec:
  ingressClassName: nginx
  tls:
    - hosts: [amplify.example.com]
      secretName: amplify-tls
  rules:
    - host: amplify.example.com
      http:
        paths:
          - path: /jira-hub
            pathType: Prefix
            backend:
              service:
                name: jira-hub
                port:
                  name: streamlit
