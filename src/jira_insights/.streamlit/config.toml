# Streamlit settings for Jira Insights (src/jira_insights/app.py).
# Streamlit reads .streamlit/config.toml from the working directory — the
# launcher (src/jira_insights/launcher.py) starts the app from the tool root.

[server]
headless = true
port = 8501                   # overridden by INSIGHTS_PORT via the launcher
# The app is embedded in the Amplify QEA UI with an <iframe> served from a
# different port (or route), so cross-origin requests and the XSRF cookie
# would otherwise block widgets such as the file uploader.
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200           # MB — large Jira CSV / Excel exports

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Apple-style light palette, matching Amplify QEA (amplify/static/css/amplify.css).
# The Amplify shell also asks for dark mode via embed_options=dark_theme.
[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
borderColor = "#d2d2d7"
font = "sans-serif"
