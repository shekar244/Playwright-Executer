<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amplify QEA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0e0e18;--surface:#181828;--surface2:#1e1e30;--surface3:#262640;
      --border:#2a2a42;--border-hover:#3a3a58;
      --border-focus:rgba(120,165,255,0.45);--text:#dde3f8;--text-dim:#5e5e7a;
      --text-muted:#8e98bc;--accent:#7ea8ff;--accent-glow:rgba(126,168,255,0.12);
      --accent-border:rgba(126,168,255,0.28);
      --green:#8ecb8a;--green-glow:rgba(142,203,138,0.14);--red:#f07090;
      --red-glow:rgba(240,112,144,0.14);--yellow:#f0d080;--yellow-glow:rgba(240,208,128,0.14);
      --teal:#7ecdc0;--purple:#b898f5;--peach:#f0a070;
      --header-bg:rgba(10,10,18,0.95);--input-bg:#141422;--input-border:#2e2e48;--log-bg:#090914;
      --radius:8px;--radius-lg:12px;--radius-xl:16px;
      --shadow-sm:0 1px 6px rgba(0,0,0,0.45);--shadow-md:0 4px 20px rgba(0,0,0,0.55);
      --shadow-lg:0 8px 40px rgba(0,0,0,0.65);--tr:0.18s ease;
    }
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;}

    /* ── Header ── */
    header{background:var(--header-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:0 20px;height:56px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:100;}
    header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--accent) 0%,var(--purple) 40%,transparent 70%);opacity:0.35;}
    .header-logo{display:flex;align-items:center;gap:10px;}
    .logo-mark{width:30px;height:30px;background:linear-gradient(135deg,#6ea8ff 0%,#a87aff 100%);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 18px rgba(110,168,255,0.35),0 2px 6px rgba(0,0,0,0.4);flex-shrink:0;}
    header h1{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.01em;}
    header h1 span{background:linear-gradient(90deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .repo-subtitle{color:var(--text-dim);font-size:11.5px;padding:4px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;transition:border-color var(--tr);}
    .header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
    .version-badge{font-size:10px;font-weight:600;color:var(--text-dim);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;letter-spacing:0.04em;}
    .help-link{color:var(--text-dim);font-size:11px;font-weight:600;text-decoration:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 12px;transition:all var(--tr);background:var(--surface2);}
    .help-link:hover{color:var(--accent);border-color:var(--accent-border);background:var(--accent-glow);}
    .dot{display:none;}

    /* ── Tab navigation — pill style ── */
    .tab-nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:3px;flex-shrink:0;padding:8px 14px;}
    .tab-btn{padding:6px 14px;font-size:12px;font-weight:600;color:var(--text-dim);background:transparent;border:1px solid transparent;border-radius:20px;cursor:pointer;font-family:'Inter',inherit;letter-spacing:0.015em;transition:all var(--tr);display:flex;align-items:center;gap:5px;white-space:nowrap;}
    .tab-btn:hover:not(.active){color:var(--text);background:var(--surface2);border-color:var(--border);}
    .tab-btn.active{color:var(--accent);background:var(--accent-glow);border-color:var(--accent-border);font-weight:700;}
    .tab-icon{font-size:12px;line-height:1;}

    /* ── Layout ── */
    .body{display:flex;flex:1;min-height:0;gap:0;}
    .panel-left{width:400px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:14px 12px;gap:10px;}
    .section-block{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);flex-shrink:0;transition:border-color var(--tr);}
    .section-block:focus-within{border-color:var(--border-hover);}
    .section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);padding:9px 14px 8px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;align-items:center;gap:7px;}
    .section-title::before{content:'';width:2px;height:12px;background:linear-gradient(to bottom,var(--accent),var(--purple));border-radius:2px;flex-shrink:0;}
    .section-title .stitle-icon{font-size:11px;}
    .section-content{padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
    .field{display:flex;flex-direction:column;gap:5px;}
    .field label{font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:0.02em;}
    .field-row{display:flex;gap:6px;align-items:center;}
    .field-row input,.field-row select{flex:1;}
    .hint{font-size:10.5px;color:var(--text-dim);margin-top:2px;line-height:1.45;}

    /* ── Inputs ── */
    input[type="text"],input[type="number"],input[type="password"],select{background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-size:12px;font-family:'Inter',inherit;width:100%;outline:none;transition:border-color var(--tr),box-shadow var(--tr);}
    input[type="text"]:focus,input[type="number"]:focus,input[type="password"]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
    input[type="text"]:hover:not(:focus),input[type="number"]:hover:not(:focus),input[type="password"]:hover:not(:focus),select:hover:not(:focus){border-color:var(--border-hover);}
    select option{background:#181828;}
    input[type="number"]{width:72px;}
    .checkboxes{display:flex;gap:12px;flex-wrap:wrap;}
    .checkbox-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);cursor:pointer;user-select:none;font-weight:500;}
    .checkbox-label input[type="checkbox"]{accent-color:var(--accent);cursor:pointer;width:14px;height:14px;}

    /* ── Buttons ── */
    .btn{padding:7px 18px;border:none;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;transition:all var(--tr);font-family:'Inter',inherit;letter-spacing:0.01em;display:inline-flex;align-items:center;gap:6px;}
    .btn:active{transform:scale(0.96);}
    .btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}
    .btn-run{background:linear-gradient(135deg,#8ecb8a 0%,#5eb880 100%);color:#071110;box-shadow:0 2px 8px rgba(94,184,128,0.2);}
    .btn-run:hover:not(:disabled){box-shadow:0 4px 18px rgba(94,184,128,0.35);transform:translateY(-1px);}
    .btn-stop{background:linear-gradient(135deg,#f07090 0%,#d84870 100%);color:#120608;box-shadow:0 2px 8px rgba(240,112,144,0.2);}
    .btn-stop:hover:not(:disabled){box-shadow:0 4px 18px rgba(240,112,144,0.35);transform:translateY(-1px);}
    .btn-sm{background:var(--surface2);color:var(--text-muted);padding:5px 12px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:var(--radius);}
    .btn-sm:hover:not(:disabled){border-color:var(--accent-border);color:var(--accent);background:var(--accent-glow);}
    .btn-accent{background:linear-gradient(135deg,var(--accent) 0%,#5a88e8 100%);color:#060e20;box-shadow:0 2px 8px rgba(126,168,255,0.25);}
    .btn-accent:hover:not(:disabled){box-shadow:0 4px 18px rgba(126,168,255,0.4);transform:translateY(-1px);}
    .browse-btn{background:var(--surface2);border:1px solid var(--input-border);border-radius:var(--radius);color:var(--text-muted);padding:7px 11px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:'Inter',inherit;transition:all var(--tr);}
    .browse-btn:hover{border-color:var(--accent-border);color:var(--accent);}
    .action-row{display:flex;gap:8px;align-items:center;}
    .report-box{background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:8px;transition:border-color var(--tr);}
    .report-box:has(.report-path.found){border-color:rgba(142,203,138,0.25);}
    .report-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
    .report-path{font-size:11px;color:var(--text-dim);word-break:break-all;font-family:'JetBrains Mono',monospace;}
    .report-path.found{color:var(--green);}

    /* ── Log panel ── */
    .panel-right{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--log-bg);}
    .log-header{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:rgba(255,255,255,0.018);}
    .log-title{font-size:10px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:0.12em;display:flex;align-items:center;gap:6px;}
    .log-actions{margin-left:auto;display:flex;gap:5px;}
    #log{flex:1;overflow-y:auto;padding:14px 18px;font-family:'JetBrains Mono',"Menlo","Monaco",monospace;font-size:11.5px;line-height:1.7;white-space:pre-wrap;word-break:break-all;}
    .log-line{display:block;padding:1px 0;}
    .log-cmd{color:#b898f5;font-weight:500;} .log-sep{color:#1e1e34;} .log-passed{color:#8ecb8a;}
    .log-failed{color:#f07090;} .log-warning{color:#f0d080;} .log-info{color:#7ecdc0;}
    .log-highlight{color:#f0a070;} .log-default{color:#7a82a0;}

    /* ── Status bar ── */
    .statusbar{padding:0 16px;height:32px;background:var(--header-bg);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:11px;flex-shrink:0;}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);transition:background 0.2s,box-shadow 0.2s,transform 0.2s;}
    .status-dot.running{background:var(--yellow);box-shadow:0 0 8px var(--yellow-glow);animation:pulse-dot 1.2s ease-in-out infinite;}
    .status-dot.passed{background:var(--green);box-shadow:0 0 8px var(--green-glow);}
    .status-dot.failed{background:var(--red);box-shadow:0 0 8px var(--red-glow);}
    @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.55;transform:scale(1.35);}}
    .status-label{font-weight:700;color:var(--text-muted);font-size:10px;letter-spacing:0.07em;text-transform:uppercase;}
    .status-cmd{color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    /* ── Test name list ── */
    .test-name-item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer;transition:background var(--tr);}
    .test-name-item:hover{background:var(--surface3);}
    .test-name-item input[type="checkbox"]{accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
    .test-name-item label{font-size:11px;font-family:'JetBrains Mono',monospace;cursor:pointer;color:var(--text);word-break:break-all;}

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
    ::-webkit-scrollbar-thumb:hover{background:var(--border-hover);}

    /* ── Config sub-tab nav — pill style ── */
    .cfg-tab-btn{padding:6px 14px;font-size:11.5px;font-weight:600;color:var(--text-dim);background:transparent;border:1px solid transparent;border-radius:20px;cursor:pointer;font-family:'Inter',inherit;letter-spacing:0.015em;transition:all var(--tr);margin:0;}
    .cfg-tab-btn:hover:not(.active){color:var(--text);background:var(--surface2);border-color:var(--border);}
    .cfg-tab-btn.active{color:var(--accent);background:var(--accent-glow);border-color:var(--accent-border);font-weight:700;}

    /* ── Feature & tool cards ── */
    #page-features{display:none;flex:1;min-height:0;}
    #page-features.active{display:flex;}
    .features-left{width:420px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:14px 12px;gap:10px;}
    .features-right{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--log-bg);}
    .feature-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;cursor:pointer;transition:border-color var(--tr),box-shadow var(--tr),background var(--tr);flex-shrink:0;}
    .feature-card:hover{border-color:var(--accent-border);box-shadow:0 0 0 1px var(--accent-glow),var(--shadow-sm);}
    .feature-card.selected{border-color:var(--accent-border);background:rgba(126,168,255,0.06);}
    .feature-card-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
    .feature-card-name{font-size:13px;font-weight:700;color:var(--text);flex:1;}
    .feature-card-desc{font-size:11px;color:var(--text-dim);margin-bottom:6px;line-height:1.45;}
    .feature-card-script{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text-muted);word-break:break-all;margin-bottom:6px;}
    .feature-card-actions{display:flex;gap:6px;}
    .badge-python{background:rgba(240,208,128,0.14);color:#f0d080;}
    .badge-node{background:rgba(142,203,138,0.14);color:#8ecb8a;}
    .badge-shell{background:rgba(126,205,192,0.14);color:#7ecdc0;}
    .feat-form{background:var(--surface2);border:1px solid var(--accent-border);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 24px var(--accent-glow);}
    .feat-form h3{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.09em;}
    .feat-form-actions{display:flex;gap:8px;justify-content:flex-end;}
    #page-tools{display:none;flex:1;flex-direction:column;overflow:hidden;}
    #page-tools.active{display:flex;}
    #page-executor{display:flex;flex:1;min-height:0;}
    #page-executor.hidden{display:none;}
    .tools-layout{display:flex;flex:1;min-height:0;gap:0;}
    .tools-panel{width:100%;max-width:720px;margin:0 auto;padding:24px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
    .tool-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:flex-start;gap:14px;transition:border-color var(--tr),box-shadow var(--tr);}
    .tool-card:hover{border-color:var(--accent-border);box-shadow:var(--shadow-sm);}
    .tool-card-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-glow);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .tool-card-info{flex:1;min-width:0;}
    .tool-card-label{font-size:13px;font-weight:700;color:var(--text);}
    .tool-card-flag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-top:3px;}
    .tool-card-meta{font-size:11px;color:var(--text-dim);margin-top:3px;}
    .tool-card-actions{display:flex;gap:6px;flex-shrink:0;}
    .tool-form{background:var(--surface2);border:1px solid var(--accent-border);border-radius:var(--radius-lg);padding:18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 24px var(--accent-glow);}
    .tool-form h3{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.09em;}
    .tool-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .tool-form-grid .field.full{grid-column:1/-1;}
    .tool-form-actions{display:flex;gap:8px;justify-content:flex-end;}
    .empty-state{text-align:center;color:var(--text-dim);font-size:12px;padding:40px 0;display:flex;flex-direction:column;align-items:center;gap:8px;}
    .empty-state-icon{font-size:32px;opacity:0.35;}
    .badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:6px;letter-spacing:0.02em;}
    .badge-checkbox{background:rgba(126,205,192,0.14);color:var(--teal);}
    .badge-dropdown{background:rgba(184,152,245,0.14);color:var(--purple);}

    /* ── Dashboard ── */
    #page-dashboard{display:none;flex:1;flex-direction:column;overflow-y:auto;background:var(--bg);}
    #page-dashboard.active{display:flex;}
    .dash-body{padding:20px 22px;display:flex;flex-direction:column;gap:18px;flex:1;}
    .dash-title{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px;letter-spacing:-0.02em;}
    .dash-title .dash-sub{font-size:12px;font-weight:400;color:var(--text-dim);}
    .dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);transition:border-color var(--tr);}
    .dash-card:hover{border-color:var(--border-hover);}
    .dash-card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);display:flex;align-items:center;gap:8px;}
    .dash-card-title::before{content:'';display:block;width:3px;height:13px;background:linear-gradient(to bottom,var(--accent),var(--purple));border-radius:2px;flex-shrink:0;}
    .dash-chart-wrap{position:relative;height:190px;display:flex;align-items:center;justify-content:center;}
    .dash-legend{display:flex;flex-direction:column;gap:5px;}
    .dash-legend-item{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-muted);padding:3px 0;}
    .dash-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .dash-legend-val{margin-left:auto;font-weight:700;color:var(--text);font-size:12px;font-family:'JetBrains Mono',monospace;}
    .dash-stats{display:flex;gap:10px;flex-wrap:wrap;}
    .stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:110px;flex:1;box-shadow:var(--shadow-sm);transition:border-color var(--tr),box-shadow var(--tr);position:relative;overflow:hidden;}
    .stat-pill::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
    .stat-pill.s-total::before{background:linear-gradient(90deg,var(--accent),var(--purple));}
    .stat-pill.s-passed::before{background:var(--green);}
    .stat-pill.s-failed::before{background:var(--red);}
    .stat-pill.s-broken::before{background:var(--yellow);}
    .stat-pill.s-skipped::before{background:var(--accent);}
    .stat-pill:hover{border-color:var(--accent-border);box-shadow:var(--shadow-md);}
    .stat-pill-label{font-size:10px;text-transform:uppercase;letter-spacing:0.09em;color:var(--text-dim);font-weight:600;}
    .stat-pill-value{font-size:28px;font-weight:700;line-height:1;font-family:'Inter',sans-serif;}
    .stat-pill-value.passed{color:var(--green);} .stat-pill-value.failed{color:var(--red);}
    .stat-pill-value.broken{color:var(--yellow);} .stat-pill-value.skipped{color:var(--accent);}
    .stat-pill-value.total{color:var(--text);}
    .dash-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);}
    .dash-table-header{padding:12px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.02);}
    .dash-table-header h3{font-size:13px;font-weight:700;color:var(--text);}
    table.history-tbl{width:100%;border-collapse:collapse;font-size:12px;}
    table.history-tbl th{background:var(--bg);color:var(--text-dim);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:0.08em;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);}
    table.history-tbl td{padding:9px 14px;border-bottom:1px solid rgba(42,42,66,0.6);color:var(--text-muted);vertical-align:middle;}
    table.history-tbl tr:last-child td{border-bottom:none;}
    table.history-tbl tbody tr:hover td{background:rgba(126,168,255,0.04);}
    .tbl-status-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;gap:4px;}
    .tbl-status-badge.passed{background:rgba(142,203,138,0.12);color:var(--green);border:1px solid rgba(142,203,138,0.22);}
    .tbl-status-badge.failed{background:rgba(240,112,144,0.12);color:var(--red);border:1px solid rgba(240,112,144,0.22);}
    .tbl-status-badge.cancelled{background:rgba(240,208,128,0.12);color:var(--yellow);border:1px solid rgba(240,208,128,0.22);}
    .tbl-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;}
    .tbl-num.pass{color:var(--green);} .tbl-num.fail{color:var(--red);}
    .tbl-num.skip{color:var(--accent);} .tbl-num.broken{color:var(--yellow);}

    /* ── Zephyr / Test Management ── */
    #page-zephyr{display:none;flex:1;min-height:0;}
    #page-zephyr.active{display:flex;}
    .zephyr-left{width:390px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:14px 12px;gap:10px;}
    .zephyr-right{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--log-bg);}
    .zephyr-log{flex:1;overflow-y:auto;padding:16px 18px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;white-space:pre-wrap;word-break:break-all;}
    .zephyr-step{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex-shrink:0;transition:border-color var(--tr);}
    .zephyr-step:focus-within{border-color:var(--border-hover);}
    .zephyr-step-title{font-size:11px;font-weight:700;color:var(--text);letter-spacing:0.04em;display:flex;align-items:center;gap:10px;}
    .zephyr-step-num{background:linear-gradient(135deg,var(--accent),var(--purple));color:#040a1a;min-width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;box-shadow:0 0 10px var(--accent-glow);}
    .zephyr-breadcrumb{font-size:11px;color:var(--text-dim);display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;}
    .zephyr-breadcrumb span{color:var(--text-muted);}
    .zephyr-breadcrumb .crumb{color:var(--accent);font-weight:600;}
    .folder-tree{display:flex;flex-direction:column;gap:2px;max-height:160px;overflow-y:auto;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);padding:4px;}
    .folder-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-muted);border:1px solid transparent;transition:all var(--tr);}
    .folder-item:hover{background:var(--surface2);color:var(--text);}
    .folder-item.selected{background:var(--accent-glow);border-color:var(--accent-border);color:var(--accent);font-weight:600;}
    .folder-item .folder-icon{flex-shrink:0;font-size:13px;}
    .folder-children{margin-left:16px;}
    .drop-zone{border:2px dashed var(--input-border);border-radius:var(--radius-lg);padding:24px 16px;text-align:center;cursor:pointer;transition:all var(--tr);color:var(--text-dim);font-size:12px;background:var(--input-bg);}
    .drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:var(--accent-glow);color:var(--accent);}
    .drop-zone input[type="file"]{display:none;}
    .drop-zone-icon{font-size:28px;margin-bottom:8px;display:block;opacity:0.55;}
    .z-file-info{background:rgba(142,203,138,0.07);border:1px solid rgba(142,203,138,0.2);border-radius:var(--radius);padding:9px 12px;font-size:11px;color:var(--green);display:none;align-items:center;gap:8px;}
    .z-file-info.visible{display:flex;}
    .connect-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);display:inline-block;margin-right:4px;transition:background 0.2s,box-shadow 0.2s;}
    .connect-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green-glow);}
    .connect-dot.err{background:var(--red);box-shadow:0 0 6px var(--red-glow);}
    .ztab-btn{border-radius:var(--radius) !important;transition:all var(--tr);}
    .ztab-btn.active{background:var(--accent) !important;color:#040a1a !important;border-color:var(--accent) !important;font-weight:700;}
    .import-mode-btn.active{background:var(--surface2) !important;color:var(--accent) !important;border-color:var(--accent-border) !important;font-weight:700;}
    .vtab-layout{display:flex;min-height:0;}
    .vtab-nav{display:flex;flex-direction:column;gap:2px;width:148px;flex-shrink:0;border-right:1px solid var(--border);padding:8px 6px;}
    .vtab-btn{padding:9px 12px;text-align:left;background:transparent;border:none;border-radius:var(--radius);color:var(--text-muted);cursor:pointer;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.02em;transition:all var(--tr);line-height:1.4;}
    .vtab-btn:hover:not(.active){color:var(--text);background:var(--surface2);}
    .vtab-btn.active{color:var(--accent);background:var(--accent-glow);border:1px solid var(--accent-border);}
    .vtab-btn .vtab-icon{display:block;font-size:16px;margin-bottom:3px;}
    .vtab-panel{flex:1;padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-width:0;}
    .vtab-panel.hidden{display:none;}
    .mapping-group-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--text-dim);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:2px;}
  </style>
</head>
<body>

<header>
  <div class="header-logo">
    <div class="logo-mark">⚡</div>
    <h1>Amplify <span>QEA</span></h1>
  </div>
  <div class="repo-subtitle" id="repoSubtitle">select a repo to begin</div>
  <div class="header-right">
    <span class="version-badge">v1.0.0</span>
    <a href="/readme" target="_blank" class="help-link" title="Open documentation">Docs</a>
  </div>
</header>

<nav class="tab-nav">
  <button type="button" class="tab-btn active" id="navbtn-executor" onclick="switchTab('executor')"><span class="tab-icon">⚡</span>Executor</button>
  <button type="button" class="tab-btn" id="navbtn-dashboard" onclick="switchTab('dashboard')"><span class="tab-icon">📊</span>Dashboard</button>
  <button type="button" class="tab-btn" id="navbtn-zephyr" onclick="switchTab('zephyr')"><span class="tab-icon">🔷</span>Test Management</button>
  <button type="button" class="tab-btn" id="navbtn-filemanager" onclick="switchTab('filemanager')"><span class="tab-icon">🗂️</span>File Manager</button>
  <button type="button" class="tab-btn" id="navbtn-studio" onclick="switchTab('studio')"><span class="tab-icon">🔬</span>AI Studio</button>
  <button type="button" class="tab-btn" id="navbtn-tools" onclick="switchTab('tools')"><span class="tab-icon">⚙️</span>Config</button>
</nav>

{% include 'partials/executor.html' %}
{% include 'partials/dashboard.html' %}
{% include 'partials/testmanagement.html' %}
{% include 'partials/filemanager.html' %}
{% include 'partials/studio.html' %}

<!-- Status bar -->
<div class="statusbar">
  <div class="status-dot" id="statusDot"></div>
  <span class="status-label" id="statusLabel">IDLE</span>
  <span class="status-cmd" id="statusCmd"></span>
</div>

<script>
// ── Shared state ──────────────────────────────────────────────────────────────
let testTree = {};
let lastReport = null;
let eventSource = null;
let autoScroll = true;
let _runContext = 'executor';
let _selectedFeat = null;
let _activeLogEl = null;  // Direct reference to target log div — set at run-start, never clobbered

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function _fmtDur(ms) {
  if (!ms) return '0ms';
  if (ms < 1000) return Math.round(ms) + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  return Math.floor(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's';
}

function classifyLine(line) {
  const lo = line.toLowerCase();
  if (/^passed/i.test(line)) return 'passed';
  if (/^failed/i.test(line)) return 'failed';
  if (/^error/i.test(line))  return 'failed';
  if (lo.includes('passed') && !lo.includes('failed') && !lo.includes('error')) return 'highlight';
  if (lo.includes('failed') || lo.includes('error') || lo.includes('traceback')) return 'failed';
  if (lo.includes('warning') || lo.includes('warn')) return 'warning';
  if (/^[=\-]/.test(line)) return 'sep';
  return 'default';
}

function appendLine(text, cls) {
  const log = _activeLogEl || document.getElementById(
    _runContext === 'features' ? 'features-log' :
    _runContext === 'git'      ? 'git-log'       :
    _runContext === 'venv'     ? 'venv-log'      : 'log'
  );
  if (!log) return;
  const span = document.createElement('span');
  span.className = 'log-line log-' + (cls || 'default');
  span.textContent = text;
  log.appendChild(span);
  if (autoScroll) log.scrollTop = log.scrollHeight;
}

function clearLog()     { autoScroll = true; const l = document.getElementById('log'); l.innerHTML = ''; l.scrollTop = 0; }
function clearFeatLog() { document.getElementById('features-log').innerHTML = ''; }
function clearVenvLog() { const l = document.getElementById('venv-log'); if (l) { l.innerHTML = ''; l.scrollTop = 0; } }
function scrollToBottom()     { const l = document.getElementById('log');          l.scrollTop = l.scrollHeight; }
function featScrollToBottom() { const l = document.getElementById('features-log'); l.scrollTop = l.scrollHeight; }

function setStatus(state, label, cmd) {
  document.getElementById('statusDot').className   = 'status-dot ' + state;
  document.getElementById('statusLabel').textContent = label;
  if (cmd !== undefined) document.getElementById('statusCmd').textContent = cmd.slice(0, 100);
}

function setRunning(running) {
  document.getElementById('runBtn').disabled  = running;
  document.getElementById('stopBtn').disabled = !running;
  const fr = document.getElementById('featRunBtn');
  const fs = document.getElementById('featStopBtn');
  if (fr) fr.disabled = running || !_selectedFeat;
  if (fs) fs.disabled = !running;
}

function switchTab(tab) {
  const pages = ['executor','tools','dashboard','zephyr','filemanager','studio'];
  pages.forEach(p => {
    const el = document.getElementById('page-' + p);
    if (el) {
      if (p === 'executor') { el.classList.toggle('hidden', p !== tab); }
      else if (p === 'filemanager') { el.style.display = (p === tab) ? 'flex' : 'none'; }
      else { el.classList.toggle('active', p === tab); }
    }
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const key = btn.id.replace('navbtn-', '');
    btn.classList.toggle('active', key === tab);
  });
  if (tab === 'tools')       { switchCfgTab('features'); loadTools(); loadFeatures(); loadZephyrConfig(); loadMappingConfig(); }
  if (tab === 'dashboard')   loadDashboard();
  if (tab === 'zephyr')      { loadZephyrConfig(); _updateZephyrContextBanners(); loadZephyrStatuses(); }
  if (tab === 'filemanager') initFileManager();
  if (tab === 'studio')      studioRefresh();
}

// ── Status polling fallback (Windows SSE reliability) ─────────────────────────
// Polls every 4 s; if server says idle but UI still shows running, resets UI.
let _pollTimer = null;
function _startStatusPoll() {
  _stopStatusPoll();
  _pollTimer = setInterval(async () => {
    const s = await fetch('/api/status').then(r => r.json()).catch(() => ({}));
    if (!s.running && document.getElementById('runBtn')?.disabled) {
      setRunning(false);
      _runContext  = 'executor';
      _activeLogEl = null;
      setStatus('idle', 'IDLE');
    }
  }, 4000);
}
function _stopStatusPoll() { if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; } }

function connectStream() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/stream');
  eventSource.addEventListener('cmd', e => {
    const cmd = JSON.parse(e.data);
    appendLine('$ ' + cmd, 'cmd');
    appendLine('─'.repeat(60), 'sep');
    setStatus('running', 'RUNNING', cmd);
    document.getElementById('statusCmd').textContent = cmd.slice(0, 120);
    _startStatusPoll();  // begin polling so UI recovers if SSE drops
  });
  eventSource.addEventListener('line', e => {
    const text = JSON.parse(e.data);
    appendLine(text, classifyLine(text));
  });
  eventSource.addEventListener('status', e => {
    const s = JSON.parse(e.data);
    appendLine('─'.repeat(60), 'sep');
    if (s === 'passed') {
      const msg = (_runContext === 'features' || _runContext === 'git') ? '✓  Done.'
                : _runContext === 'venv' ? '✓  pip install completed successfully.'
                : '✓  All tests passed!';
      appendLine(msg, 'passed');
      if (_runContext !== 'venv') setStatus('passed', 'PASSED');
    } else if (s === 'cancelled') {
      appendLine('⚠  Cancelled by user.', 'warning');
      if (_runContext !== 'venv') setStatus('idle', 'CANCELLED');
    } else {
      const code = s.split(':')[1] || '?';
      const msg = _runContext === 'venv'
        ? `✗  pip install failed  (exit code ${code}).`
        : `✗  Finished with failures  (exit code ${code}).`;
      appendLine(msg, 'failed');
      if (_runContext !== 'venv') setStatus('failed', 'FAILED');
    }
    setRunning(false);
    _runContext  = 'executor';
    _activeLogEl = null;
    _stopStatusPoll();  // SSE confirmed completion — no need to poll
  });
  eventSource.addEventListener('done', e => {
    refreshReport();
    if (document.getElementById('auto_open').checked) openReport('individual');
  });
  eventSource.onerror = () => { eventSource.close(); setTimeout(connectStream, 1000); };
}

function refreshLog() {
  // Reconnect SSE stream — the server replays recent buffered events on connect.
  // Useful when logs stop appearing due to a dropped connection.
  connectStream();
  const btn = event?.currentTarget;
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '↺ …';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1200);
  }
}

document.getElementById('log').addEventListener('scroll', function() {
  autoScroll = this.scrollTop + this.clientHeight >= this.scrollHeight - 20;
});

// ── UI Tab kill-switch ────────────────────────────────────────────────────────
// Maps tab key → { navBtn id, cfgBtn id (optional) }
const UI_TAB_MAP = {
  dashboard:    { nav: 'navbtn-dashboard' },
  zephyr:       { nav: 'navbtn-zephyr' },
  cfg_git:      { cfg: 'ctab-git' },
  cfg_tools:    { cfg: 'ctab-tools' },
  cfg_mapping:  { cfg: 'ctab-mapping' },
  cfg_zephyr:   { cfg: 'ctab-zephyr' },
};

function applyUiTabs(tabs) {
  const defaults = { dashboard: true, zephyr: true, cfg_git: true, cfg_tools: true, cfg_mapping: true, cfg_zephyr: true };
  const t = Object.assign({}, defaults, tabs || {});
  Object.entries(UI_TAB_MAP).forEach(([key, ids]) => {
    const visible = !!t[key];
    if (ids.nav) {
      const btn = document.getElementById(ids.nav);
      if (btn) btn.style.display = visible ? '' : 'none';
    }
    if (ids.cfg) {
      const btn = document.getElementById(ids.cfg);
      if (btn) btn.style.display = visible ? '' : 'none';
    }
  });
}

async function init() {
  const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
  if (cfg.default_browser) document.getElementById('browser').value = cfg.default_browser;
  if (cfg.browsers) {
    const sel = document.getElementById('browser');
    sel.innerHTML = cfg.browsers.map(b => `<option value="${b}">${b}</option>`).join('');
    if (cfg.default_browser) sel.value = cfg.default_browser;
  }
  if (cfg.markers?.length) populateMarkers(cfg.markers);
  renderExtraOptions(cfg.extra_options || []);
  applyUiTabs(cfg.ui_tabs || {});
  await scanRepos(cfg.repo_root || '');
  loadPinnedRepos();  // populate pinned repos panel
  connectStream();
  loadConfigInfo();  // show active config file in the Config File panel
  if (typeof checkVenvStatus === 'function') checkVenvStatus();
  if (cfg.venv_path) { const el = document.getElementById('venvPathInput'); if (el) el.value = cfg.venv_path; }


}

init();
</script>
<script src="/static/js/executor.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/testmanagement.js"></script>
</body>
</html>
