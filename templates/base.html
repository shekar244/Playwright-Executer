<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playwright Test Executor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#16161e;--surface:#1f1f2e;--surface2:#2a2a3d;--border:#383854;
      --border-focus:rgba(137,180,250,0.4);--text:#cdd6f4;--text-dim:#808099;
      --text-muted:#a6adc8;--accent:#89b4fa;--accent-glow:rgba(137,180,250,0.15);
      --green:#a6e3a1;--green-glow:rgba(166,227,161,0.15);--red:#f38ba8;
      --red-glow:rgba(243,139,168,0.15);--yellow:#f9e2af;--yellow-glow:rgba(249,226,175,0.15);
      --teal:#94e2d5;--purple:#cba6f7;--mauve:#cba6f7;--peach:#fab387;
      --header-bg:#0f0f1a;--input-bg:#222233;--input-border:#44445e;--log-bg:#0d0d17;
      --sep:#383854;--radius:7px;--radius-lg:11px;
      --shadow-sm:0 1px 4px rgba(0,0,0,0.5);--shadow-md:0 4px 16px rgba(0,0,0,0.5);
      --shadow-lg:0 8px 32px rgba(0,0,0,0.6);
    }
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;}
    header{background:var(--header-bg);padding:0 20px;height:52px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;}
    header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--accent) 0%,transparent 60%);opacity:0.4;}
    .header-logo{display:flex;align-items:center;gap:10px;}
    .logo-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--accent) 0%,var(--purple) 100%);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 12px rgba(137,180,250,0.3);flex-shrink:0;}
    header h1{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.01em;}
    header h1 span{color:var(--accent);}
    .repo-subtitle{color:var(--text-dim);font-size:12px;padding:3px 10px;background:var(--surface);border:1px solid var(--border);border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;}
    .header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
    .version-badge{font-size:10px;font-weight:600;color:var(--text-dim);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 9px;letter-spacing:0.03em;}
    .help-link{color:var(--text-dim);font-size:11px;font-weight:600;text-decoration:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 12px;transition:all 0.15s;background:var(--surface);}
    .help-link:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-glow);box-shadow:0 0 8px var(--accent-glow);}
    .dot{display:none;}
    .body{display:flex;flex:1;min-height:0;gap:0;}
    .panel-left{width:400px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:16px 14px;gap:12px;}
    .section-block{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);flex-shrink:0;}
    .section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);padding:9px 14px 8px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;align-items:center;gap:6px;}
    .section-title .stitle-icon{font-size:12px;}
    .section-content{padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
    .field{display:flex;flex-direction:column;gap:5px;}
    .field label{font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:0.02em;}
    .field-row{display:flex;gap:6px;align-items:center;}
    .field-row input,.field-row select{flex:1;}
    .hint{font-size:10px;color:var(--text-dim);margin-top:2px;line-height:1.4;}
    input[type="text"],input[type="number"],input[type="password"],select{background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-size:12px;font-family:'Inter',inherit;width:100%;outline:none;transition:border-color 0.15s,box-shadow 0.15s;}
    input[type="text"]:focus,input[type="number"]:focus,input[type="password"]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
    select option{background:#1e1e30;}
    input[type="number"]{width:72px;}
    .checkboxes{display:flex;gap:12px;flex-wrap:wrap;}
    .checkbox-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);cursor:pointer;user-select:none;font-weight:500;}
    .checkbox-label input[type="checkbox"]{accent-color:var(--accent);cursor:pointer;width:14px;height:14px;}
    .btn{padding:7px 18px;border:none;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:'Inter',inherit;letter-spacing:0.01em;display:inline-flex;align-items:center;gap:6px;}
    .btn:active{transform:scale(0.97);}
    .btn:disabled{opacity:0.38;cursor:not-allowed;transform:none;}
    .btn-run{background:linear-gradient(135deg,#a6e3a1 0%,#74c7a0 100%);color:#0d1117;box-shadow:0 0 0 0 var(--green-glow);}
    .btn-run:hover:not(:disabled){box-shadow:0 0 14px var(--green-glow);transform:translateY(-1px);}
    .btn-stop{background:linear-gradient(135deg,#f38ba8 0%,#e06c8a 100%);color:#0d1117;}
    .btn-stop:hover:not(:disabled){box-shadow:0 0 14px var(--red-glow);transform:translateY(-1px);}
    .btn-sm{background:var(--surface2);color:var(--text-muted);padding:5px 12px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:var(--radius);}
    .btn-sm:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-glow);}
    .btn-accent{background:linear-gradient(135deg,var(--accent) 0%,#6fa3e8 100%);color:#0d1117;}
    .btn-accent:hover:not(:disabled){box-shadow:0 0 14px var(--accent-glow);transform:translateY(-1px);}
    .browse-btn{background:var(--surface2);border:1px solid var(--input-border);border-radius:var(--radius);color:var(--text-muted);padding:7px 11px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:'Inter',inherit;transition:all 0.15s;}
    .browse-btn:hover{border-color:var(--accent);color:var(--accent);}
    .action-row{display:flex;gap:8px;align-items:center;}
    .report-box{background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:8px;transition:border-color 0.15s;}
    .report-box:has(.report-path.found){border-color:rgba(166,227,161,0.25);}
    .report-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
    .report-path{font-size:11px;color:var(--text-dim);word-break:break-all;font-family:'JetBrains Mono',monospace;}
    .report-path.found{color:var(--green);}
    .panel-right{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--log-bg);}
    .log-header{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:rgba(255,255,255,0.02);}
    .log-title{font-size:10px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;display:flex;align-items:center;gap:6px;}
    .log-actions{margin-left:auto;display:flex;gap:6px;}
    #log{flex:1;overflow-y:auto;padding:14px 18px;font-family:'JetBrains Mono',"Menlo","Monaco",monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;word-break:break-all;}
    .log-line{display:block;padding:0.5px 0;}
    .log-cmd{color:#cba6f7;font-weight:500;} .log-sep{color:#2e2e45;} .log-passed{color:#a6e3a1;}
    .log-failed{color:#f38ba8;} .log-warning{color:#f9e2af;} .log-info{color:#89dceb;}
    .log-highlight{color:#fab387;} .log-default{color:#9399b2;}
    .statusbar{padding:0 16px;height:30px;background:var(--header-bg);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:11px;flex-shrink:0;}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);transition:background 0.2s,box-shadow 0.2s;}
    .status-dot.running{background:var(--yellow);box-shadow:0 0 6px var(--yellow-glow);animation:pulse-dot 1.2s ease-in-out infinite;}
    .status-dot.passed{background:var(--green);box-shadow:0 0 6px var(--green-glow);}
    .status-dot.failed{background:var(--red);box-shadow:0 0 6px var(--red-glow);}
    @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.6;transform:scale(1.3);}}
    .status-label{font-weight:700;color:var(--text-muted);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;}
    .status-cmd{color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .test-name-item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer;transition:background 0.1s;}
    .test-name-item:hover{background:var(--border);}
    .test-name-item input[type="checkbox"]{accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
    .test-name-item label{font-size:11px;font-family:'JetBrains Mono',monospace;cursor:pointer;color:var(--text);word-break:break-all;}
    ::-webkit-scrollbar{width:5px;height:5px;} ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;} ::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
    .tab-nav{background:var(--header-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:2px;flex-shrink:0;padding:6px 12px 0;}
    .tab-btn{padding:6px 16px;font-size:12px;font-weight:600;color:var(--text-dim);background:transparent;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;cursor:pointer;font-family:'Inter',inherit;letter-spacing:0.02em;transition:all 0.15s;display:flex;align-items:center;gap:6px;margin-bottom:-1px;}
    .tab-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.04);}
    .tab-btn.active{color:var(--accent);background:var(--surface);border-color:var(--border);border-bottom-color:var(--surface);}
    .tab-icon{font-size:13px;line-height:1;}
    #page-features{display:none;flex:1;min-height:0;}
    #page-features.active{display:flex;}
    .features-left{width:420px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:16px 14px;gap:12px;}
    .features-right{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--log-bg);}
    .feature-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s;flex-shrink:0;}
    .feature-card:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-glow);}
    .feature-card.selected{border-color:var(--accent);background:rgba(137,180,250,0.06);}
    .feature-card-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
    .feature-card-name{font-size:13px;font-weight:700;color:var(--text);flex:1;}
    .feature-card-desc{font-size:11px;color:var(--text-dim);margin-bottom:6px;line-height:1.4;}
    .feature-card-script{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text-muted);word-break:break-all;margin-bottom:6px;}
    .feature-card-actions{display:flex;gap:6px;}
    .badge-python{background:rgba(249,226,175,0.15);color:#f9e2af;}
    .badge-node{background:rgba(166,227,161,0.15);color:#a6e3a1;}
    .badge-shell{background:rgba(148,226,213,0.15);color:#94e2d5;}
    .feat-form{background:var(--surface2);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 20px var(--accent-glow);}
    .feat-form h3{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em;}
    .feat-form-actions{display:flex;gap:8px;justify-content:flex-end;}
    #page-tools{display:none;flex:1;flex-direction:column;overflow:hidden;}
    #page-tools.active{display:flex;}
    #page-executor{display:flex;flex:1;min-height:0;}
    #page-executor.hidden{display:none;}
    .tools-layout{display:flex;flex:1;min-height:0;gap:0;}
    .tools-panel{width:100%;max-width:720px;margin:0 auto;padding:24px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
    .tool-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:flex-start;gap:14px;transition:border-color 0.15s;}
    .tool-card:hover{border-color:rgba(137,180,250,0.3);}
    .tool-card-icon{width:36px;height:36px;border-radius:9px;background:var(--accent-glow);border:1px solid rgba(137,180,250,0.2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .tool-card-info{flex:1;min-width:0;}
    .tool-card-label{font-size:13px;font-weight:700;color:var(--text);}
    .tool-card-flag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-top:3px;}
    .tool-card-meta{font-size:11px;color:var(--text-dim);margin-top:3px;}
    .tool-card-actions{display:flex;gap:6px;flex-shrink:0;}
    .tool-form{background:var(--surface2);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 20px var(--accent-glow);}
    .tool-form h3{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em;}
    .tool-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .tool-form-grid .field.full{grid-column:1/-1;}
    .tool-form-actions{display:flex;gap:8px;justify-content:flex-end;}
    .empty-state{text-align:center;color:var(--text-dim);font-size:12px;padding:40px 0;display:flex;flex-direction:column;align-items:center;gap:8px;}
    .empty-state-icon{font-size:32px;opacity:0.4;}
    .badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;margin-left:6px;letter-spacing:0.02em;}
    .badge-checkbox{background:rgba(148,226,213,0.15);color:var(--teal);}
    .badge-dropdown{background:rgba(203,166,247,0.15);color:var(--purple);}
    #page-dashboard{display:none;flex:1;flex-direction:column;overflow-y:auto;background:var(--bg);}
    #page-dashboard.active{display:flex;}
    .dash-body{padding:22px 24px;display:flex;flex-direction:column;gap:20px;flex:1;}
    .dash-title{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px;letter-spacing:-0.01em;}
    .dash-title .dash-sub{font-size:12px;font-weight:400;color:var(--text-dim);}
    .dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);}
    .dash-card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);display:flex;align-items:center;gap:6px;}
    .dash-card-title::before{content:'';display:block;width:3px;height:14px;background:linear-gradient(to bottom,var(--accent),var(--purple));border-radius:2px;}
    .dash-chart-wrap{position:relative;height:190px;display:flex;align-items:center;justify-content:center;}
    .dash-legend{display:flex;flex-direction:column;gap:5px;}
    .dash-legend-item{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-muted);padding:3px 0;}
    .dash-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
    .dash-legend-val{margin-left:auto;font-weight:700;color:var(--text);font-size:12px;font-family:'JetBrains Mono',monospace;}
    .dash-stats{display:flex;gap:12px;flex-wrap:wrap;}
    .stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:110px;flex:1;box-shadow:var(--shadow-sm);transition:border-color 0.15s,box-shadow 0.15s;position:relative;overflow:hidden;}
    .stat-pill::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
    .stat-pill.s-total::before{background:linear-gradient(90deg,var(--accent),var(--purple));}
    .stat-pill.s-passed::before{background:var(--green);}
    .stat-pill.s-failed::before{background:var(--red);}
    .stat-pill.s-broken::before{background:var(--yellow);}
    .stat-pill.s-skipped::before{background:var(--accent);}
    .stat-pill:hover{border-color:rgba(137,180,250,0.3);box-shadow:var(--shadow-md);}
    .stat-pill-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:600;}
    .stat-pill-value{font-size:28px;font-weight:700;line-height:1;font-family:'Inter',sans-serif;}
    .stat-pill-value.passed{color:var(--green);} .stat-pill-value.failed{color:var(--red);}
    .stat-pill-value.broken{color:var(--yellow);} .stat-pill-value.skipped{color:var(--accent);}
    .stat-pill-value.total{color:var(--text);}
    .dash-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);}
    .dash-table-header{padding:12px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.025);}
    .dash-table-header h3{font-size:13px;font-weight:700;color:var(--text);}
    table.history-tbl{width:100%;border-collapse:collapse;font-size:12px;}
    table.history-tbl th{background:var(--bg);color:var(--text-dim);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:0.08em;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);}
    table.history-tbl td{padding:9px 14px;border-bottom:1px solid rgba(46,46,69,0.5);color:var(--text-muted);vertical-align:middle;}
    table.history-tbl tr:last-child td{border-bottom:none;}
    table.history-tbl tbody tr:hover td{background:rgba(137,180,250,0.04);}
    .tbl-status-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;gap:4px;}
    .tbl-status-badge.passed{background:rgba(166,227,161,0.12);color:var(--green);border:1px solid rgba(166,227,161,0.2);}
    .tbl-status-badge.failed{background:rgba(243,139,168,0.12);color:var(--red);border:1px solid rgba(243,139,168,0.2);}
    .tbl-status-badge.cancelled{background:rgba(249,226,175,0.12);color:var(--yellow);border:1px solid rgba(249,226,175,0.2);}
    .tbl-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;}
    .tbl-num.pass{color:var(--green);} .tbl-num.fail{color:var(--red);}
    .tbl-num.skip{color:var(--accent);} .tbl-num.broken{color:var(--yellow);}
    #page-zephyr{display:none;flex:1;min-height:0;}
    #page-zephyr.active{display:flex;}
    .zephyr-left{width:390px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:16px 14px;gap:12px;}
    .zephyr-right{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--log-bg);}
    .zephyr-log{flex:1;overflow-y:auto;padding:16px 18px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;white-space:pre-wrap;word-break:break-all;}
    .zephyr-step{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex-shrink:0;}
    .zephyr-step-title{font-size:11px;font-weight:700;color:var(--text);letter-spacing:0.05em;display:flex;align-items:center;gap:10px;}
    .zephyr-step-num{background:linear-gradient(135deg,var(--accent),var(--purple));color:#0d1117;min-width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;box-shadow:0 0 8px var(--accent-glow);}
    .zephyr-breadcrumb{font-size:11px;color:var(--text-dim);display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;}
    .zephyr-breadcrumb span{color:var(--text-muted);}
    .zephyr-breadcrumb .crumb{color:var(--accent);font-weight:600;}
    .folder-tree{display:flex;flex-direction:column;gap:2px;max-height:160px;overflow-y:auto;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);padding:4px;}
    .folder-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-muted);border:1px solid transparent;transition:all 0.1s;}
    .folder-item:hover{background:var(--surface);color:var(--text);}
    .folder-item.selected{background:var(--accent-glow);border-color:rgba(137,180,250,0.3);color:var(--accent);font-weight:600;}
    .folder-item .folder-icon{flex-shrink:0;font-size:13px;}
    .folder-children{margin-left:16px;}
    .drop-zone{border:2px dashed var(--input-border);border-radius:var(--radius-lg);padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.15s;color:var(--text-dim);font-size:12px;background:var(--input-bg);}
    .drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:var(--accent-glow);color:var(--accent);}
    .drop-zone input[type="file"]{display:none;}
    .drop-zone-icon{font-size:28px;margin-bottom:8px;display:block;opacity:0.6;}
    .z-file-info{background:rgba(166,227,161,0.08);border:1px solid rgba(166,227,161,0.2);border-radius:var(--radius);padding:9px 12px;font-size:11px;color:var(--green);display:none;align-items:center;gap:8px;}
    .z-file-info.visible{display:flex;}
    .connect-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);display:inline-block;margin-right:4px;transition:background 0.2s,box-shadow 0.2s;}
    .connect-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green-glow);}
    .connect-dot.err{background:var(--red);box-shadow:0 0 6px var(--red-glow);}
    .ztab-btn{border-radius:var(--radius) !important;transition:all 0.15s;}
    .ztab-btn.active{background:var(--accent) !important;color:#0d1117 !important;border-color:var(--accent) !important;font-weight:700;}
    .import-mode-btn.active{background:var(--surface2) !important;color:var(--accent) !important;border-color:var(--accent) !important;font-weight:700;}
    .cfg-tab-btn{padding:6px 16px;font-size:12px;font-weight:600;color:var(--text-dim);background:transparent;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;cursor:pointer;font-family:'Inter',inherit;letter-spacing:0.02em;transition:all 0.12s;margin-bottom:-1px;}
    .cfg-tab-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.04);}
    .cfg-tab-btn.active{color:var(--accent);background:var(--surface);border-color:var(--border);border-bottom-color:var(--surface);}
    .vtab-layout{display:flex;min-height:0;}
    .vtab-nav{display:flex;flex-direction:column;gap:2px;width:148px;flex-shrink:0;border-right:1px solid var(--border);padding:8px 0;}
    .vtab-btn{padding:9px 14px;text-align:left;background:transparent;border:none;border-right:2px solid transparent;color:var(--text-muted);cursor:pointer;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.02em;transition:all 0.12s;line-height:1.4;}
    .vtab-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.04);}
    .vtab-btn.active{color:var(--accent);border-right-color:var(--accent);background:var(--accent-glow);}
    .vtab-btn .vtab-icon{display:block;font-size:16px;margin-bottom:3px;}
    .vtab-panel{flex:1;padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-width:0;}
    .vtab-panel.hidden{display:none;}
    .mapping-group-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--text-dim);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:2px;}
  </style>
</head>
<body>

<header>
  <div class="header-logo">
    <div class="logo-mark">🎭</div>
    <h1>Playwright <span>Executor</span></h1>
  </div>
  <div class="repo-subtitle" id="repoSubtitle">select a repo to begin</div>
  <div class="header-right">
    <span class="version-badge">v1.0.0</span>
    <a href="/readme" target="_blank" class="help-link" title="Open documentation">? Help</a>
  </div>
</header>

<nav class="tab-nav">
  <button type="button" class="tab-btn active" id="navbtn-executor" onclick="switchTab('executor')"><span class="tab-icon">⚡</span>Executor</button>
  <button type="button" class="tab-btn" id="navbtn-tools" onclick="switchTab('tools')"><span class="tab-icon">⚙️</span>Config</button>
  <button type="button" class="tab-btn" id="navbtn-dashboard" onclick="switchTab('dashboard')"><span class="tab-icon">📊</span>Reports Dashboard</button>
  <button type="button" class="tab-btn" id="navbtn-zephyr" onclick="switchTab('zephyr')"><span class="tab-icon">🔷</span>Test Management</button>
  <button type="button" class="tab-btn" id="navbtn-filemanager" onclick="switchTab('filemanager')"><span class="tab-icon">🗂️</span>File Manager</button>
</nav>

{% include 'partials/executor.html' %}
{% include 'partials/dashboard.html' %}
{% include 'partials/testmanagement.html' %}
{% include 'partials/filemanager.html' %}

<!-- Status bar -->
<div class="statusbar">
  <div class="status-dot" id="statusDot"></div>
  <span class="status-label" id="statusLabel">IDLE</span>
  <span class="status-cmd" id="statusCmd"></span>
</div>

<script>
// ── Shared state ──────────────────────────────────────────────────────────────
let testTree = {};
let lastReport = null;
let eventSource = null;
let autoScroll = true;
let _runContext = 'executor';
let _selectedFeat = null;
let _activeLogEl = null;  // Direct reference to target log div — set at run-start, never clobbered

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function _fmtDur(ms) {
  if (!ms) return '0ms';
  if (ms < 1000) return Math.round(ms) + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  return Math.floor(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's';
}

function classifyLine(line) {
  const lo = line.toLowerCase();
  if (/^passed/i.test(line)) return 'passed';
  if (/^failed/i.test(line)) return 'failed';
  if (/^error/i.test(line))  return 'failed';
  if (lo.includes('passed') && !lo.includes('failed') && !lo.includes('error')) return 'highlight';
  if (lo.includes('failed') || lo.includes('error') || lo.includes('traceback')) return 'failed';
  if (lo.includes('warning') || lo.includes('warn')) return 'warning';
  if (/^[=\-]/.test(line)) return 'sep';
  return 'default';
}

function appendLine(text, cls) {
  // Use the pinned element reference if available, else fall back to context string
  const log = _activeLogEl || document.getElementById(
    _runContext === 'features' ? 'features-log' :
    _runContext === 'git'      ? 'git-log'       : 'log'
  );
  if (!log) return;
  const span = document.createElement('span');
  span.className = 'log-line log-' + (cls || 'default');
  span.textContent = text;
  log.appendChild(span);
  if (autoScroll) log.scrollTop = log.scrollHeight;
}

function clearLog()     { document.getElementById('log').innerHTML = ''; }
function clearFeatLog() { document.getElementById('features-log').innerHTML = ''; }
function scrollToBottom()     { const l = document.getElementById('log');          l.scrollTop = l.scrollHeight; }
function featScrollToBottom() { const l = document.getElementById('features-log'); l.scrollTop = l.scrollHeight; }

function setStatus(state, label, cmd) {
  document.getElementById('statusDot').className   = 'status-dot ' + state;
  document.getElementById('statusLabel').textContent = label;
  if (cmd !== undefined) document.getElementById('statusCmd').textContent = cmd.slice(0, 100);
}

function setRunning(running) {
  document.getElementById('runBtn').disabled  = running;
  document.getElementById('stopBtn').disabled = !running;
  const fr = document.getElementById('featRunBtn');
  const fs = document.getElementById('featStopBtn');
  if (fr) fr.disabled = running || !_selectedFeat;
  if (fs) fs.disabled = !running;
}

function switchTab(tab) {
  const pages = ['executor','tools','dashboard','zephyr','filemanager'];
  pages.forEach(p => {
    const el = document.getElementById('page-' + p);
    if (el) {
      if (p === 'executor') { el.classList.toggle('hidden', p !== tab); }
      else if (p === 'filemanager') { el.style.display = (p === tab) ? 'flex' : 'none'; }
      else { el.classList.toggle('active', p === tab); }
    }
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const key = btn.id.replace('navbtn-', '');
    btn.classList.toggle('active', key === tab);
  });
  if (tab === 'tools')       { switchCfgTab('features'); loadTools(); loadFeatures(); loadZephyrConfig(); loadMappingConfig(); }
  if (tab === 'dashboard')   loadDashboard();
  if (tab === 'zephyr')      { loadZephyrConfig(); _updateZephyrContextBanners(); loadZephyrStatuses(); }
  if (tab === 'filemanager') initFileManager();
}

function connectStream() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/stream');
  eventSource.addEventListener('cmd', e => {
    const cmd = JSON.parse(e.data);
    appendLine('$ ' + cmd, 'cmd');
    appendLine('─'.repeat(72), 'sep');
    setStatus('running', 'RUNNING', cmd);
    document.getElementById('statusCmd').textContent = cmd.slice(0, 120);
  });
  eventSource.addEventListener('line', e => {
    appendLine(JSON.parse(e.data), classifyLine(JSON.parse(e.data)));
  });
  eventSource.addEventListener('status', e => {
    const s = JSON.parse(e.data);
    appendLine('─'.repeat(72), 'sep');
    if (s === 'passed') {
      appendLine((_runContext === 'features' || _runContext === 'git') ? '✓  Done.' : '✓  All tests passed!', 'passed');
      setStatus('passed', 'PASSED');
    } else if (s === 'cancelled') {
      appendLine('⚠  Execution cancelled by user.', 'warning');
      setStatus('idle', 'CANCELLED');
    } else {
      const code = s.split(':')[1] || '?';
      appendLine(`✗  Finished with failures  (exit code ${code}).`, 'failed');
      setStatus('failed', 'FAILED');
    }
    setRunning(false);
    _runContext = 'executor';
    _activeLogEl = null;  // Release the pinned log so next run can set its own
  });
  eventSource.addEventListener('done', e => {
    refreshReport();
    if (document.getElementById('auto_open').checked) openReport('individual');
  });
  eventSource.onerror = () => setTimeout(connectStream, 3000);
}

document.getElementById('log').addEventListener('scroll', function() {
  autoScroll = this.scrollTop + this.clientHeight >= this.scrollHeight - 20;
});

// ── UI Tab kill-switch ────────────────────────────────────────────────────────
// Maps tab key → { navBtn id, cfgBtn id (optional) }
const UI_TAB_MAP = {
  dashboard:    { nav: 'navbtn-dashboard' },
  zephyr:       { nav: 'navbtn-zephyr' },
  cfg_git:      { cfg: 'ctab-git' },
  cfg_tools:    { cfg: 'ctab-tools' },
  cfg_mapping:  { cfg: 'ctab-mapping' },
  cfg_zephyr:   { cfg: 'ctab-zephyr' },
};

function applyUiTabs(tabs) {
  const defaults = { dashboard: true, zephyr: true, cfg_git: true, cfg_tools: true, cfg_mapping: true, cfg_zephyr: true };
  const t = Object.assign({}, defaults, tabs || {});
  Object.entries(UI_TAB_MAP).forEach(([key, ids]) => {
    const visible = !!t[key];
    if (ids.nav) {
      const btn = document.getElementById(ids.nav);
      if (btn) btn.style.display = visible ? '' : 'none';
    }
    if (ids.cfg) {
      const btn = document.getElementById(ids.cfg);
      if (btn) btn.style.display = visible ? '' : 'none';
    }
  });
}

async function init() {
  const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
  if (cfg.default_browser) document.getElementById('browser').value = cfg.default_browser;
  if (cfg.default_workers) document.getElementById('workers').value = cfg.default_workers;
  if (cfg.auto_open_report) document.getElementById('auto_open').checked = true;
  if (cfg.browsers) {
    const sel = document.getElementById('browser');
    sel.innerHTML = cfg.browsers.map(b => `<option value="${b}">${b}</option>`).join('');
    if (cfg.default_browser) sel.value = cfg.default_browser;
  }
  if (cfg.markers?.length) populateMarkers(cfg.markers);
  renderExtraOptions(cfg.extra_options || []);
  applyUiTabs(cfg.ui_tabs || {});
  await scanRepos(cfg.repo_root || '');
  connectStream();
  loadConfigInfo();  // show active config file in the Config File panel
  if (typeof checkVenvStatus === 'function') checkVenvStatus();
  if (cfg.venv_path) { const el = document.getElementById('venvPathInput'); if (el) el.value = cfg.venv_path; }
}

init();
</script>
<script src="/static/js/executor.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/testmanagement.js"></script>
</body>
</html>
