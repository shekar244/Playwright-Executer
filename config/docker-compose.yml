# Local Docker deployment of the whole repo: Amplify QEA (its Jira Insights side-car included) plus the
# Grid backend from coordinator/ and runner/ (PostgreSQL + coordinator). Runner pods are started on demand by
# scripts/local_pod_launcher.py, a local stand-in for KEDA.
#
# Run from the repo root:
#   scripts/local-up.sh                                 # generates config/.env on first use, then build + start
# or by hand:
#   docker compose -f config/docker-compose.yml up -d --build
#   docker compose -f config/docker-compose.yml --profile runners build runner     # the chromium runner image
#   python3 scripts/local_pod_launcher.py                                           # starts runners for queued chunks
#
# Secrets (PG_PASSWORD, GRID_API_TOKEN, POD_API_TOKEN, JWT_SECRET_KEY) are read from config/.env, which is
# git-ignored and never copied into an image. Nothing is published beyond 127.0.0.1.
name: amplify-grid

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grid
      POSTGRES_PASSWORD: ${PG_PASSWORD:?run scripts/local-up.sh or create config/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grid"]
      interval: 5s
      timeout: 3s
      retries: 20

  coordinator:
    build:
      context: ..     # repo root; Dockerfile.coordinator.dockerignore sends only coordinator/*.py + coordinator-requirements.txt
      dockerfile: Dockerfile.coordinator
    image: amplify-grid-coordinator:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${PG_PASSWORD}@postgres:5432/grid
      API_TOKEN: ${GRID_API_TOKEN:?run scripts/local-up.sh or create config/.env}
      POD_API_TOKEN: ${POD_API_TOKEN:?run scripts/local-up.sh or create config/.env}
      # Must include every environment Amplify's Admin → Grid offers (it checks its own list, then the coordinator
      # checks this one): qa3/qa4/int are p13n-mktg-exp-qe-automation's --env choices.
      SUPPORTED_ENVIRONMENTS: dev,qa,perf,prod,qa3,qa4,int
      # Only the browsers that have a runner image here (chromium: Edge and Chrome are amd64-only), so the Grid tab
      # never offers, or defaults to, a browser whose runs would wait in the queue forever.
      SUPPORTED_BROWSERS: chromium
      DEFAULT_BROWSER: chromium
    volumes:
      - coordinator-data:/data
    ports:
      - "127.0.0.1:8801:8000"   # for an Amplify run on the host (amplify.sh) and the seeder; every /api call still needs the token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  amplify:
    build:
      context: ..
      dockerfile: Dockerfile
    # Its own tag: the existing amplify-qea:latest / :local images are left alone.
    image: amplify-qea:grid-local
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?run scripts/local-up.sh or create config/.env}
      GRID_COORDINATOR_URL: http://coordinator:8000
      GRID_API_TOKEN: ${GRID_API_TOKEN}
    volumes:
      - amplify-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"   # Amplify QEA
      - "127.0.0.1:8501:8501"   # Jira Insights (started by Amplify on first use of the Insights tab)

  # Not started by `up`: only here so `--profile runners build runner` builds the image the launcher runs.
  # chromium is the one browser that exists for both arm64 and amd64 (Edge/Chrome are amd64-only);
  # build another with e.g. `BROWSER=firefox docker compose ... build runner` and tag it per the launcher's template.
  runner:
    profiles: ["runners"]
    build:
      context: ..     # repo root: the runner image bakes in runner/, src/, tests/ and pytest.ini
      dockerfile: Dockerfile.grid-runner
      args:
        BROWSER: ${BROWSER:-chromium}
    image: amplify-grid-runner-${BROWSER:-chromium}:local

volumes:
  postgres-data: {}
  coordinator-data: {}
  amplify-data: {}
