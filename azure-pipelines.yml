trigger:
  branches:
    include:
      - master
      - amplify-server-multi-user

pr:
  branches:
    include:
      - master

variables:
  JFROG_REGISTRY: 'yourcompany.jfrog.io'
  JFROG_REPO: 'docker-local'
  JFROG_REMOTE_REPO: 'docker-remote'
  IMAGE_TAG: '$(Build.BuildId)'

stages:

  - stage: Build
    displayName: 'Build & Push Docker Images'
    jobs:
      - job: BuildQEA
        displayName: 'Amplify QEA (Flask)'
        pool:
          name: 'Default'
          demands:
            - docker
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: 'Login to JFrog'
            inputs:
              command: login
              containerRegistry: 'jfrog-docker-connection'

          - script: |
              docker build \
                --build-arg BASE_REGISTRY=$(JFROG_REGISTRY)/$(JFROG_REMOTE_REPO)/ \
                --build-arg APT_PROXY=https://$(JFROG_REGISTRY)/artifactory/debian-remote \
                -t $(JFROG_REGISTRY)/$(JFROG_REPO)/amplify-qea:$(IMAGE_TAG) \
                -t $(JFROG_REGISTRY)/$(JFROG_REPO)/amplify-qea:latest \
                .
            displayName: 'Build amplify-qea'

          - script: |
              docker push $(JFROG_REGISTRY)/$(JFROG_REPO)/amplify-qea:$(IMAGE_TAG)
              docker push $(JFROG_REGISTRY)/$(JFROG_REPO)/amplify-qea:latest
            displayName: 'Push amplify-qea'

          - script: |
              echo "=========================================="
              echo "  amplify-qea pushed"
              echo "  $(JFROG_REGISTRY)/$(JFROG_REPO)/amplify-qea:$(IMAGE_TAG)"
              echo "=========================================="
            displayName: 'Print QEA Info'

      - job: BuildInsights
        displayName: 'Amplify Insights (Streamlit)'
        pool:
          name: 'Default'
          demands:
            - docker
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: 'Login to JFrog'
            inputs:
              command: login
              containerRegistry: 'jfrog-docker-connection'

          - script: |
              docker build \
                -f Dockerfile.insights \
                --build-arg BASE_REGISTRY=$(JFROG_REGISTRY)/$(JFROG_REMOTE_REPO)/ \
                -t $(JFROG_REGISTRY)/$(JFROG_REPO)/amplify-insights:$(IMAGE_TAG) \
                -t $(JFROG_REGISTRY)/$(JFROG_REPO)/amplify-insights:latest \
                .
            displayName: 'Build amplify-insights'

          - script: |
              docker push $(JFROG_REGISTRY)/$(JFROG_REPO)/amplify-insights:$(IMAGE_TAG)
              docker push $(JFROG_REGISTRY)/$(JFROG_REPO)/amplify-insights:latest
            displayName: 'Push amplify-insights'

          - script: |
              echo "=========================================="
              echo "  amplify-insights pushed"
              echo "  $(JFROG_REGISTRY)/$(JFROG_REPO)/amplify-insights:$(IMAGE_TAG)"
              echo "=========================================="
            displayName: 'Print Insights Info'

      - job: BuildCoordinator
        displayName: 'Amplify Grid Coordinator'
        pool:
          name: 'Default'
          demands:
            - docker
        steps:
          - checkout: self
            fetchDepth: 1
          - task: Docker@2
            displayName: 'Login to JFrog'
            inputs:
              command: login
              containerRegistry: 'jfrog-docker-connection'
          - script: |
              docker build \
                -f Dockerfile.coordinator \
                --build-arg BASE_REGISTRY=$(JFROG_REGISTRY)/$(JFROG_REMOTE_REPO)/ \
                -t $(JFROG_REGISTRY)/$(JFROG_REPO)/playwright-coordinator:$(IMAGE_TAG) \
                -t $(JFROG_REGISTRY)/$(JFROG_REPO)/playwright-coordinator:latest \
                .
              docker push $(JFROG_REGISTRY)/$(JFROG_REPO)/playwright-coordinator:$(IMAGE_TAG)
              docker push $(JFROG_REGISTRY)/$(JFROG_REPO)/playwright-coordinator:latest
            displayName: 'Build and push Grid coordinator'

      - job: BuildRunner
        displayName: 'Amplify Grid Runner Images'
        pool:
          name: 'Default'
          demands:
            - docker
        steps:
          - checkout: self
            fetchDepth: 1
          - task: Docker@2
            displayName: 'Login to JFrog'
            inputs:
              command: login
              containerRegistry: 'jfrog-docker-connection'
          - script: |
              for browser in chromium firefox webkit; do
                docker build \
                  -f Dockerfile.grid-runner \
                  --build-arg BROWSER="$browser" \
                  --build-arg BASE_REGISTRY=$(JFROG_REGISTRY)/$(JFROG_REMOTE_REPO)/ \
                  -t $(JFROG_REGISTRY)/$(JFROG_REPO)/playwright-runner-"$browser":$(IMAGE_TAG) \
                  -t $(JFROG_REGISTRY)/$(JFROG_REPO)/playwright-runner-"$browser":latest \
                  .
                docker push $(JFROG_REGISTRY)/$(JFROG_REPO)/playwright-runner-"$browser":$(IMAGE_TAG)
                docker push $(JFROG_REGISTRY)/$(JFROG_REPO)/playwright-runner-"$browser":latest
              done
            displayName: 'Build and push Grid runner images'
